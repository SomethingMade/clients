<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haba Code · Product Ad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0a0f0d;color:#f4f4f5;font-family:"Inter",system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px)}
.stage{width:min(100%,calc((100vh - 300px) * 1.7778));aspect-ratio:16/9;border-radius:18px;overflow:hidden;box-shadow:0 0 0 1px #ffffff14,0 40px 100px #000c;background:#000}
canvas{width:100%;height:100%;display:block}
.bar,.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
button{font:700 14px "Inter",system-ui,sans-serif;padding:12px 20px;border-radius:999px;border:1px solid #ffffff2a;background:#ffffff10;color:#f4f4f5;cursor:pointer;transition:.2s}
button:hover{background:#ffffff20}
button.p{background:#f4f4f5;color:#09090b;border-color:#f4f4f5}
button.p:hover{box-shadow:0 0 30px #34d399aa}
.up{font:700 14px "Inter",system-ui,sans-serif;padding:12px 20px;border-radius:999px;border:1px solid #34d39966;background:#34d39922;color:#f4f4f5;cursor:pointer}.up:hover{background:#34d39940}#logoPrev{width:44px;height:44px;border-radius:12px;object-fit:cover;border:1px solid #ffffff30}
button:disabled{opacity:.5;cursor:wait}
.hide{display:none!important}
select,input{font:600 14px "Inter",system-ui,sans-serif;padding:11px 14px;border-radius:999px;border:1px solid #ffffff2a;background:#ffffff10;color:#f4f4f5;outline:none}
select option{color:#111}input{width:190px}input::placeholder{color:#8fa79d}
#msg{min-height:18px;font-size:13px;color:#9fd8c0;text-align:center}
</style>
</head>
<body>
<div class="stage"><canvas id="cv"></canvas></div>
<div id="login" class="row hide">
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button id="signin">Sign in</button>
  <button id="google">Google</button>
</div>
<div class="row">
  <label class="up" for="logoFile">Upload logo</label><input id="logoFile" type="file" accept="image/*" hidden>
  <img id="logoPrev" class="hide" alt="Logo preview"><button id="logoClear" class="hide">Remove logo</button><span id="logoMsg" style="font-size:13px;color:#ff8a8a"></span>
</div>
<div class="row hide">
  <label class="up" for="phFile">Upload people photos</label><input id="phFile" type="file" accept="image/*" multiple hidden><button id="phClear" class="hide">Remove photos</button><span id="phMsg" style="font-size:13px;color:#9fd8c0"></span>
</div>
<div class="row">
  <select id="voice" class="hide" aria-label="Voiceover"><option value="rex">Voiceover: Rex (male)</option><option value="sal">Voiceover: Sal (male)</option><option value="leo">Voiceover: Leo (male)</option><option value="none">No voiceover</option></select>
  <select id="sfx" aria-label="Sound effects"><option value="on">Sound effects: On</option><option value="off">Sound effects: Off</option></select>
  <span id="vs" class="hide" style="font-size:13px;color:#9fd8c0">Sign in to use voiceover</span>
  <button id="out" class="hide">Sign out</button>
</div>
<div id="msg"></div>
<div class="bar">
  <button id="replay">↻ Replay</button>
  <button id="dl" class="p">Download video</button>
  <button id="cp">Copy caption</button>
</div>

<script>
const W = 1920, H = 1080; let T = 25;
const cv = document.getElementById("cv"), c = cv.getContext("2d"); const CW = 1920, CH = 1080; cv.width = CW; cv.height = CH;
let NOW = 0;
let HEAD = '"Inter",system-ui,-apple-system,"Helvetica Neue",sans-serif', INK = "#1d1d1f", GRN = "#087f5b", MINT = "#34d399", LIME = "#6ee7b7", GREY = "#86868b";
const DISP = '"Sora","Inter",system-ui,sans-serif';
const FIL = "filter" in CanvasRenderingContext2D.prototype;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), lerp = (a, b, t) => a + (b - a) * t;
const oc = t => 1 - Math.pow(1 - clamp(t), 3), oe = t => { t = clamp(t); return t >= 1 ? 1 : 1 - Math.pow(2, -10 * t); };
const io = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const sp = t => { t = clamp(t); return t >= 1 ? 1 : 1 - Math.exp(-8 * t) * Math.cos(7 * t); }; // gentle spring
const seg = (t, a, b) => clamp((t - a) / (b - a));
const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); };
const F = (w, s, fam = HEAD, ls = 0) => { c.font = `${w} ${s}px ${fam}`; c.letterSpacing = ls + "px"; };

// ---------- helpers ----------
const hx = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixc = (a, b, p) => { const A = hx(a), B = hx(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], clamp(p)))).join(",")})`; };
const lumOf = s => { const [r, g, b] = s.split(",").map(Number); return (.299 * r + .587 * g + .114 * b) / 255; };
const onAcc = () => (lumOf(ARGB2) + lumOf(SRGB)) / 2 > .72 ? "#0a0a0a" : "#ffffff";
const gradH = (x0, m) => { const g = c.createLinearGradient(x0, 0, x0 + m, 0); g.addColorStop(0, `rgb(${ARGB})`); g.addColorStop(1, `rgb(${SRGB})`); return g; };
const accFill = (x, y, w, h) => { const g = c.createLinearGradient(x, y, x + w, y + h); g.addColorStop(0, `rgb(${ARGB2})`); g.addColorStop(1, `rgb(${SRGB})`); return g; };
function glow(x, y, r, rgb, a) { if (a <= 0) return; const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`); c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2); }
function txt(s, x, y, size, fill, p, o = {}) { // soft rise + fade
  p = clamp(p); if (p <= 0) return;
  const w = o.w || 600, al = o.al || "center", bl = o.blur == null ? 8 : o.blur;
  let ls = o.ls != null ? o.ls : -size * .03; F(w, size, HEAD, ls); let m = c.measureText(s).width;
  if (o.fit && m > o.fit) { size *= o.fit / m; if (o.ls == null) ls = -size * .03; F(w, size, HEAD, ls); m = c.measureText(s).width; }
  const rise = o.rise == null ? size * .3 : o.rise, x0 = al === "center" ? x - m / 2 : al === "right" ? x - m : x;
  c.textAlign = al; c.textBaseline = "middle"; c.save(); c.globalAlpha *= p; if (FIL && bl) c.filter = `blur(${(1 - p) * bl}px)`;
  c.fillStyle = typeof fill === "function" ? fill(x0, m) : fill; c.fillText(s, x, y + (1 - p) * rise); c.restore();
}
function maskLine(s, x, y, size, fill, p) { // headline rises out of a mask; a delayed, offset outline trails behind it
  p = clamp(p); if (p <= 0) return; F(700, size, DISP, -size * .03); c.textAlign = "center"; c.textBaseline = "middle";
  let m = c.measureText(s).width; if (m > W * .89) { size *= W * .89 / m; F(700, size, DISP, -size * .03); m = c.measureText(s).width; }
  c.save(); c.beginPath(); c.rect(0, y - size * .62, W, size * 1.3); c.clip();
  const q = clamp(p - .22); if (q > 0 && p < 1) { c.save(); c.globalAlpha *= (1 - q) * .55 * (1 - seg(p, .8, 1)); c.lineWidth = 2.5; c.strokeStyle = `rgb(${ARGB})`; c.strokeText(s, x - 14 * (1 - q), y + (1 - q) * size * .85 + 12 * (1 - q)); c.restore(); }
  c.globalAlpha *= clamp(p * 2); c.fillStyle = typeof fill === "function" ? fill(x - m / 2, m) : fill; c.fillText(s, x, y + (1 - p) * size * .85); c.restore();
}

// ---------- theme + uploaded logo ----------
let SLATE = "#223a37", ARGB = "52,211,153", ARGB2 = "16,185,129", SRGB = "10,132,255", LOGO = null, LOGO_BG = null;
const h2r = (h, s, l) => { const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l), f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); return [f(0), f(8), f(4)].map(v => Math.round(v * 255)); };
const r2h = (r, g, b) => { r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn; let h = 0, s = 0; if (d) { s = d / (1 - Math.abs(2 * l - 1)); h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; } return [h, s, l]; };
const hex = a => "#" + a.map(v => v.toString(16).padStart(2, "0")).join("");
function setTheme(h, s, h2, gray) {
  s = gray ? 0 : Math.max(s, .6); const m = h2r(h, s, gray ? .86 : .58);
  MINT = hex(m); LIME = hex(h2r(h, s, gray ? .96 : .74)); GRN = hex(h2r(h, s, gray ? .5 : .3)); SLATE = hex(h2r(h, gray ? 0 : .25, .17)); ARGB = m.join(","); ARGB2 = h2r(h, s, gray ? .6 : .4).join(","); SRGB = h2r(h2, Math.max(s, gray ? 0 : .6), gray ? .7 : .55).join(",");
}
function resetTheme() { setTheme(160, .6, 215); SLATE = "#223a37"; MINT = "#34d399"; LIME = "#6ee7b7"; GRN = "#0a8f63"; ARGB = "52,211,153"; ARGB2 = "16,185,129"; SRGB = "10,132,255"; LOGO = LOGO_BG = null; }
function themeFrom(img) {
  const S = 48, k = document.createElement("canvas"); k.width = k.height = S; const g = k.getContext("2d", { willReadFrequently: true }); g.drawImage(img, 0, 0, S, S); const d = g.getImageData(0, 0, S, S).data, B = {}; let tr = 0, lum = 0, op = 0;
  for (let i = 0; i < d.length; i += 4) { const a = d[i + 3]; if (a < 250) tr++; if (a < 128) continue; op++; const [h, s, l] = r2h(d[i], d[i + 1], d[i + 2]); lum += l; if (s < .3 || l < .15 || l > .9) continue; const key = Math.floor(h / 20) % 18, b = B[key] || (B[key] = { n: 0, x: 0, y: 0, s: 0 }); b.n += s; b.x += Math.cos(h * Math.PI / 180) * s; b.y += Math.sin(h * Math.PI / 180) * s; b.s += s * s; }
  LOGO_BG = tr / (S * S) > .05 ? (op && lum / op > .6 ? "#0d1211" : "#ffffff") : null;
  const ks = Object.keys(B).sort((a, b) => B[b].n - B[a].n); if (!ks.length) { setTheme(0, 0, 0, true); return; }
  const hue = b => ((Math.atan2(b.y, b.x) * 180 / Math.PI) + 360) % 360, b1 = B[ks[0]], h1 = hue(b1), s1 = b1.s / b1.n;
  const o = ks.slice(1).find(q => { const dd = Math.abs(((hue(B[q]) - h1 + 540) % 360) - 180); return dd > 40 && B[q].n > b1.n * .15; });
  setTheme(h1, s1, o ? hue(B[o]) : (h1 + 40) % 360);
}
function loadLogo(url, keep = true) {
  const im = new Image(); im.onload = () => {
    const k = document.createElement("canvas"), m = Math.min(1, 512 / Math.max(im.width, im.height)); k.width = Math.max(1, Math.round(im.width * m)); k.height = Math.max(1, Math.round(im.height * m)); k.getContext("2d").drawImage(im, 0, 0, k.width, k.height);
    LOGO = k; themeFrom(k); const pv = document.getElementById("logoPrev"); pv.src = k.toDataURL("image/png"); pv.classList.remove("hide"); document.getElementById("logoClear").classList.remove("hide");
    if (keep) { try { localStorage.setItem("habaLogo", pv.src); } catch (e) {} }
  }; im.onerror = () => { document.getElementById("logoMsg").textContent = "Could not read that image."; }; im.src = url;
}
document.getElementById("logoFile").onchange = e => { const f = e.target.files[0]; if (!f) return; document.getElementById("logoMsg").textContent = ""; const r = new FileReader(); r.onload = () => loadLogo(r.result); r.readAsDataURL(f); e.target.value = ""; };
document.getElementById("logoClear").onclick = () => { resetTheme(); document.getElementById("logoPrev").classList.add("hide"); document.getElementById("logoClear").classList.add("hide"); try { localStorage.removeItem("habaLogo"); } catch (e) {} };
try { const sv = localStorage.getItem("habaLogo"); if (sv) loadLogo(sv, false); } catch (e) {}

const PH = {}; // uploaded photos by initial: T K Z P N
function portrait(av, cx, cy, d) { // illustrated head-and-shoulders, used until real photos are uploaded
  c.save(); c.beginPath(); c.arc(cx, cy, d / 2, 0, 7); c.clip(); const g = c.createLinearGradient(cx, cy - d / 2, cx, cy + d / 2); g.addColorStop(0, mixc(av.c, "#ffffff", .45)); g.addColorStop(1, av.c); c.fillStyle = g; c.fillRect(cx - d / 2, cy - d / 2, d, d);
  c.fillStyle = mixc(av.c, "#000000", .35); c.beginPath(); c.ellipse(cx, cy + d * .5, d * .38, d * .3, 0, 0, 7); c.fill();
  c.fillStyle = av.sk; c.fillRect(cx - d * .06, cy + d * .08, d * .12, d * .16); c.beginPath(); c.ellipse(cx, cy - d * .06, d * .17, d * .21, 0, 0, 7); c.fill();
  c.fillStyle = av.hr; c.beginPath(); c.ellipse(cx, cy - d * .17, d * .19, d * .15, 0, Math.PI, 0); c.fill(); c.restore();
}
const phMsg = document.getElementById("phMsg"), phClear = document.getElementById("phClear");
document.getElementById("phFile").onchange = e => { [...e.target.files].slice(0, 5).forEach((f, i) => { const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => { PH["TKZPN"[i]] = im; phClear.classList.remove("hide"); phMsg.textContent = Object.keys(PH).length + " photo(s) in the ad (Thandi, Kabelo, Zoleka, Pieter, Nkateko)"; }; im.src = r.result; }; r.readAsDataURL(f); }); e.target.value = ""; };
phClear.onclick = () => { for (const k in PH) delete PH[k]; phClear.classList.add("hide"); phMsg.textContent = ""; };

// ---------- shared drawing ----------
function bg() { c.fillStyle = "#000"; c.fillRect(0, 0, CW, CH); }
let SQN = 5;
function sq(x, y, s, n = SQN) { // continuous-corner squircle, like an app icon
  const a = s / 2, N = 96; c.beginPath();
  for (let i = 0; i <= N; i++) { const th = i / N * Math.PI * 2, ct = Math.cos(th), st = Math.sin(th), px = x + a * Math.sign(ct) * Math.pow(Math.abs(ct), 2 / n), py = y + a * Math.sign(st) * Math.pow(Math.abs(st), 2 / n); i ? c.lineTo(px, py) : c.moveTo(px, py); }
  c.closePath();
}
function hmark(x, y, s, a = 1, dark = false, sheen = 0) {
  a = clamp(a); if (a <= 0 || s <= 0) return; c.save(); c.translate(x, y); c.globalAlpha *= a;
  c.save(); if (dark) { c.shadowColor = `rgba(${ARGB},.55)`; c.shadowBlur = s * .45; c.shadowOffsetY = s * .06; } else { c.shadowColor = "rgba(0,0,0,.28)"; c.shadowBlur = s * .22; c.shadowOffsetY = s * .1; }
  sq(0, 0, s); c.fillStyle = LOGO ? (LOGO_BG || "#0d1211") : GRN; c.fill(); c.restore();
  c.save(); sq(0, 0, s); c.clip();
  if (LOGO) { const k = Math.max(s / LOGO.width, s / LOGO.height); c.drawImage(LOGO, -LOGO.width * k / 2, -LOGO.height * k / 2, LOGO.width * k, LOGO.height * k); }
  else { const g = c.createLinearGradient(0, -s / 2, 0, s / 2); g.addColorStop(0, LIME); g.addColorStop(1, GRN); c.fillStyle = g; c.fillRect(-s / 2, -s / 2, s, s);
    c.font = `800 ${s * .6}px ${DISP}`; c.letterSpacing = `${-s * .02}px`; c.fillStyle = "#fff"; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText("h", 0, -s * .02); }
  const gl = c.createLinearGradient(0, -s / 2, 0, s / 2); gl.addColorStop(0, "rgba(255,255,255,.22)"); gl.addColorStop(.5, "rgba(255,255,255,0)"); c.fillStyle = gl; c.fillRect(-s / 2, -s / 2, s, s);
  if (sheen > 0 && sheen < 1) { const bx = lerp(-s * .9, s * .9, sheen), g2 = c.createLinearGradient(bx - s * .2, 0, bx + s * .2, 0); g2.addColorStop(0, "rgba(255,255,255,0)"); g2.addColorStop(.5, "rgba(255,255,255,.5)"); g2.addColorStop(1, "rgba(255,255,255,0)"); c.rotate(.45); c.fillStyle = g2; c.fillRect(-s * 1.2, -s * 1.2, s * 2.4, s * 2.4); }
  c.restore(); sq(0, 0, s); c.lineWidth = Math.max(1.5, s * .006); c.strokeStyle = dark ? "rgba(255,255,255,.22)" : "rgba(0,0,0,.08)"; c.stroke(); c.restore();
}
function fillIco(n, x, y, s, col) { c.save(); c.translate(x - s / 2, y - s / 2); c.scale(s / 24, s / 24); c.fillStyle = col; ICO[n].forEach(q => c.fill(q)); c.restore(); }

// ---------- real SVG icons (Lucide, 24px grid) ----------
const rc=(x,y,w,h)=>`M${x+2} ${y}h${w-4}a2 2 0 0 1 2 2v${h-4}a2 2 0 0 1-2 2h${4-w}a2 2 0 0 1-2-2v${4-h}a2 2 0 0 1 2-2z`,ci=(x,y,r)=>`M${x-r} ${y}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0`;
const D={
 message:["M7.9 20A9 9 0 1 0 4 16.1L2 22Z"],
 at:[ci(12,12,4),"M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"],
 hash:["M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"],
 badge:["M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z","m9 12 2 2 4-4"],
 heart:["M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"],
 camera:["M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z",ci(12,13,3)],
 phone:["M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"],
 mail:[rc(2,4,20,16),"m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"],
 pin:["M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z",ci(12,10,3)],
 music:["M9 18V5l12-2v13",ci(6,18,3),ci(18,16,3)],
 image:[rc(3,3,18,18),ci(9,9,2),"m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"],
 video:["m22 8-6 4 6 4V8Z",rc(2,6,14,12)],
 file:["M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z","M14 2v4a2 2 0 0 0 2 2h4","M10 9H8M16 13H8M16 17H8"],
 dot:[ci(12,12,10),ci(12,12,1)],
 arrow:["M5 12h14M12 5l7 7-7 7"],
 search:[ci(11,11,8),"m21 21-4.3-4.3"],

 shield:["M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z","m9 12 2 2 4-4"],
 gift:[rc(3,8,18,4),"M12 8v13","M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7","M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"]
},ICO={};for(const k in D)ICO[k]=D[k].map(q=>new Path2D(q));
function ico(n,x,y,s,col,lw=2){if(s<=0)return;c.save();c.translate(x-s/2,y-s/2);c.scale(s/24,s/24);c.strokeStyle=col;c.lineWidth=lw;c.lineCap=c.lineJoin="round";ICO[n].forEach(q=>c.stroke(q));c.restore()}
const flat=col=>{c.fillStyle=col;c.fillRect(-W,-H,3*W,3*H)};

// ---------- scenes: the whole ad is one conversation, told in bubbles ----------
const BGL = "#f5f5f7";
const HB = { logo: 1 };
const PE = {
  T: { n: "Thandi", c: "#f97316", i: "T" }, K: { n: "Kabelo", c: "#8b5cf6", i: "K" }, Z: { n: "Zoleka", c: "#ec4899", i: "Z" },
