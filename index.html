<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Trader</title>
<style>
  :root { --bg:#0b0f1a; --card:#141a2b; --line:#232b42; --text:#e8ecf5; --mute:#8b95b0; --blue:#2f5bff; --green:#1fbf75; --red:#ef4a5a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding-bottom:40px; }
  main { max-width:520px; margin:0 auto; padding:12px; }
  header { display:flex; align-items:center; gap:8px; padding:6px 2px 10px; }
  header b { font-size:18px; flex:1; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  h1,h2 { margin:0 0 10px; font-size:16px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:4px 0; }
  input,select { width:100%; padding:12px; margin-bottom:10px; border-radius:10px; border:1px solid var(--line); background:#0f1424; color:var(--text); font-size:15px; }
  select { width:auto; margin:0; }
  button { border:0; border-radius:10px; padding:12px 16px; font-size:15px; font-weight:600; color:#fff; background:var(--blue); cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); padding:8px 12px; }
  button.full { width:100%; }
  button:disabled { opacity:.5; }
  .pill { font-size:12px; padding:3px 9px; border-radius:99px; background:#232b42; color:var(--mute); }
  .pill.live { background:#3a1620; color:var(--red); }
  .big { font-size:24px; font-weight:700; }
  .mute { color:var(--mute); font-size:13px; }
  .err { color:var(--red); font-size:13px; min-height:18px; }
  .badge { display:inline-block; padding:3px 12px; border-radius:99px; font-weight:700; text-transform:uppercase; font-size:13px; }
  .buy { background:rgba(31,191,117,.18); color:var(--green); }
  .sell { background:rgba(239,74,90,.18); color:var(--red); }
  .hold { background:#232b42; color:var(--mute); }
  .actions { display:flex; gap:8px; margin-top:12px; }
  .actions button { flex:1; }
  .h { border-top:1px solid var(--line); padding:8px 0; font-size:13px; }
  .pos { color:var(--green); } .neg { color:var(--red); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main id="login" class="card" style="margin-top:24px">
  <h1>AI Trader</h1>
  <input id="email" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button id="loginBtn" class="full">Sign in</button>
  <p id="loginErr" class="err"></p>
</main>

<main id="app" hidden>
  <header>
    <b>AI Trader</b>
    <span id="mode" class="pill">no orders yet</span>
    <button id="out" class="ghost">Sign out</button>
  </header>

  <section class="card">
    <h2>Balance</h2>
    <div id="bal" class="mute">Loading…</div>
  </section>

  <section class="card">
    <div class="row">
      <select id="pair"><option>XBTZAR</option><option>ETHZAR</option></select>
      <button id="refresh" class="ghost">Refresh</button>
    </div>
    <div id="tick" class="mute">Loading…</div>
  </section>

  <section class="card">
    <button id="ask" class="full">Ask Grok</button>
    <div id="adv"></div>
  </section>

  <section class="card">
    <h2>Suggestion log</h2>
    <div id="sum" class="mute">No suggestions yet</div>
    <div id="hist"></div>
  </section>

  <p id="msg" class="err"></p>
  <p class="mute">Your UID (for OWNER_UID): <span id="uid"></span></p>
  <p class="mute">AI suggestions are not financial advice. Crypto can lose value fast.</p>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-functions.js";

const app = initializeApp({
  apiKey: "AIzaSyBQSPwpVbGrdCuOoyitAeWQHIeipj2MgIY",
  authDomain: "newstart-64c43.firebaseapp.com",
  databaseURL: "https://newstart-64c43-default-rtdb.firebaseio.com",
  projectId: "newstart-64c43",
  storageBucket: "newstart-64c43.firebasestorage.app",
  messagingSenderId: "941619830061",
  appId: "1:941619830061:web:de9e0f791eb8f6eacf87a4"
});
const auth = getAuth(app);
const fns = getFunctions(app);
const call = (name) => httpsCallable(fns, name, { timeout: 120000 });
const $ = (id) => document.getElementById(id);
const fmt = (n, d = 2) => Number(n).toLocaleString("en-ZA", { maximumFractionDigits: d });

function line(a, b) {
  const d = document.createElement("div");
  d.className = "row";
  const x = document.createElement("span"); x.textContent = a;
  const y = document.createElement("b"); y.textContent = b;
  d.append(x, y);
  return d;
}
const setMsg = (t) => { $("msg").textContent = t || ""; };
function explain(e) {
  if (e.code === "functions/permission-denied") return "Not authorised. Set OWNER_UID in trading.js to your UID below, then redeploy.";
  return e.message || "Something went wrong";
}
async function run(btn, fn) {
  btn.disabled = true; setMsg("");
  try { await fn(); } catch (e) { setMsg(explain(e)); } finally { btn.disabled = false; }
}

async function loadBalance() {
  const { data } = await call("lunoBalance")();
  const rows = (data.balance || []).filter((b) => Number(b.balance) > 0);
  $("bal").replaceChildren(...(rows.length
    ? rows.map((b) => line(b.asset, fmt(b.balance, 8)))
    : [document.createTextNode("No funds yet")]));
}
async function loadTicker() {
  const { data } = await call("lunoTicker")({ pair: $("pair").value });
  $("tick").replaceChildren(
    line("Last", "R " + fmt(data.last_trade)),
    line("Bid / Ask", fmt(data.bid) + " / " + fmt(data.ask)),
    line("24h volume", fmt(data.rolling_24_hour_volume, 4))
  );
}
async function refresh() {
  await Promise.all([
    loadBalance().catch((e) => { $("bal").textContent = explain(e); }),
    loadTicker().catch((e) => { $("tick").textContent = explain(e); }),
    loadHistory().catch(() => { $("sum").textContent = "Log unavailable until history.js is deployed"; })
  ]);
}

function renderAdvice(a) {
  setMode(a.mode);
  const box = $("adv");
  const top = document.createElement("div");
  top.className = "row";
  top.style.marginTop = "12px";
  const badge = document.createElement("span");
  badge.className = "badge " + a.action;
  badge.textContent = a.action;
  const amt = document.createElement("span");
  amt.className = "big";
  amt.textContent = a.action === "hold" ? "No trade" : "R " + fmt(a.amountZAR);
  top.append(badge, amt);
  const why = document.createElement("p");
  why.textContent = a.reason || "No reason given.";
  const conf = document.createElement("p");
  conf.className = "mute";
  conf.textContent = "Confidence " + Math.round(a.confidence * 100) + "%";
  box.replaceChildren(top, why, conf);

  if (a.action !== "hold") {
    const wrap = document.createElement("div");
    wrap.className = "actions";
    const ok = document.createElement("button");
    ok.textContent = a.mode === "live" ? "Confirm real order" : "Confirm (dry-run)";
    const no = document.createElement("button");
    no.className = "ghost";
    no.textContent = "Dismiss";
    no.onclick = () => box.replaceChildren();
    ok.onclick = () => run(ok, async () => {
      const { data } = await call("lunoPlaceOrder")({ pair: a.pair, side: a.action, amountZAR: a.amountZAR });
      box.replaceChildren(document.createTextNode(
        data.dryRun ? "Dry-run logged. No real order was placed."
                    : "Order placed. ID: " + data.order_id));
      await refresh();
    });
    wrap.append(ok, no);
    box.append(wrap);
  }
}
function setMode(m) {
  $("mode").textContent = m;
  $("mode").className = "pill" + (m === "live" ? " live" : "");
}

async function loadHistory() {
  const { data } = await call("tradeHistory")();
  const items = data.items || [];
  let n = 0, win = 0, sum = 0;
  const rows = items.map((i) => {
    const ch = i.now ? ((i.now - i.price) / i.price) * 100 : null;
    const res = ch === null ? null : (i.action === "sell" ? -ch : ch);
    if (i.action !== "hold" && res !== null) { n++; if (res > 0) win++; sum += res; }
    const d = document.createElement("div");
    d.className = "h";
    const t = new Date(i.ts).toLocaleString("en-ZA", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    const top = line(t + " · " + i.pair, i.action.toUpperCase() + (i.action === "hold" ? "" : " R" + fmt(i.amountZAR)));
    const sub = document.createElement("div");
    sub.className = "mute";
    if (ch === null) sub.textContent = "R " + fmt(i.price);
    else {
      const shown = i.action === "hold" ? ch : res;
      sub.textContent = "R " + fmt(i.price) + " → R " + fmt(i.now) + " · " +
        (i.action === "hold" ? "price moved " : "result ") + (shown >= 0 ? "+" : "") + shown.toFixed(2) + "%";
      if (i.action !== "hold") sub.className = "mute " + (res > 0 ? "pos" : "neg");
    }
    d.append(top, sub);
    return d;
  });
  $("hist").replaceChildren(...rows);
  $("sum").textContent = items.length === 0 ? "No suggestions yet"
    : n === 0 ? "Only hold suggestions so far"
    : win + " of " + n + " buy/sell suggestions are up since. Average " + (sum / n >= 0 ? "+" : "") + (sum / n).toFixed(2) + "% before fees.";
}

$("loginBtn").onclick = async () => {
  $("loginErr").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pw").value); }
  catch (e) { $("loginErr").textContent = "Sign-in failed. Check email and password."; }
};
$("out").onclick = () => signOut(auth);
$("refresh").onclick = (e) => run(e.target, refresh);
$("pair").onchange = () => loadTicker().catch((e) => setMsg(explain(e)));
$("ask").onclick = (e) => run(e.target, async () => {
  $("adv").textContent = "Grok is thinking…";
  try {
    const { data } = await call("tradeAdvise")({ pair: $("pair").value });
    renderAdvice(data);
    call("tradeLogSave")(data).then(loadHistory).catch(() => {});
  } catch (err) { $("adv").replaceChildren(); throw err; }
});

onAuthStateChanged(auth, (user) => {
  $("login").hidden = !!user;
  $("app").hidden = !user;
  if (user) { $("uid").textContent = user.uid; refresh(); }
});
</script>
</body>
</html>
