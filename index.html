<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haba · Verified Badge Ad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0a0f0d;color:#f4f4f5;font-family:"Inter",system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px)}
.stage{width:min(100%,calc(100vh - 300px));aspect-ratio:1/1;border-radius:18px;overflow:hidden;box-shadow:0 0 0 1px #ffffff14,0 40px 100px #000c;background:#000}
canvas{width:100%;height:100%;display:block}
.bar,.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
button{font:700 14px "Inter",system-ui,sans-serif;padding:12px 20px;border-radius:999px;border:1px solid #ffffff2a;background:#ffffff10;color:#f4f4f5;cursor:pointer;transition:.2s}
button:hover{background:#ffffff20}
button.p{background:#f4f4f5;color:#09090b;border-color:#f4f4f5}
button.p:hover{box-shadow:0 0 30px #34d399aa}
.up{font:700 14px "Inter",system-ui,sans-serif;padding:12px 20px;border-radius:999px;border:1px solid #34d39966;background:#34d39922;color:#f4f4f5;cursor:pointer}.up:hover{background:#34d39940}#logoPrev{width:44px;height:44px;border-radius:12px;object-fit:cover;border:1px solid #ffffff30}
button:disabled{opacity:.5;cursor:wait}
.hide{display:none!important}
select,input{font:600 14px "Inter",system-ui,sans-serif;padding:11px 14px;border-radius:999px;border:1px solid #ffffff2a;background:#ffffff10;color:#f4f4f5;outline:none}
select option{color:#111}input{width:190px}input::placeholder{color:#8fa79d}
#msg{min-height:18px;font-size:13px;color:#9fd8c0;text-align:center}
</style>
</head>
<body>
<div class="stage"><canvas id="cv"></canvas></div>
<div id="login" class="row hide">
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button id="signin">Sign in</button>
  <button id="google">Google</button>
</div>
<div class="row">
  <label class="up" for="logoFile">Upload logo</label><input id="logoFile" type="file" accept="image/*" hidden>
  <img id="logoPrev" class="hide" alt="Logo preview"><button id="logoClear" class="hide">Remove logo</button><span id="logoMsg" style="font-size:13px;color:#ff8a8a"></span>
</div>
<div class="row">
  <select id="voice" aria-label="Voiceover"><option value="rex">Voiceover: Rex (male)</option><option value="sal">Voiceover: Sal (male)</option><option value="leo">Voiceover: Leo (male)</option><option value="none">No voiceover</option></select>
  <select id="sfx" aria-label="Sound effects"><option value="on">Sound effects: On</option><option value="off">Sound effects: Off</option></select>
  <span id="vs" style="font-size:13px;color:#9fd8c0">Sign in to use voiceover</span>
  <button id="out" class="hide">Sign out</button>
</div>
<div id="msg"></div>
<div class="bar">
  <button id="replay">↻ Replay</button>
  <button id="dl" class="p">Download video</button>
  <button id="cp">Copy caption</button>
</div>

// ---------- theme + uploaded logo ----------

    c.font = `800 ${s * .6}px ${HEAD}`; c.letterSpacing = `${-s * .02}px`; c.fillStyle = "#fff"; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText("h", 0, -s * .02); }
