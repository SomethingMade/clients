<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haba · Ad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0a0f0d;color:#f4f4f5;font-family:"Inter Tight",system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px)}
.stage{width:min(100%,calc((100vh - 300px) * 9 / 16));aspect-ratio:9/16;border-radius:18px;overflow:hidden;box-shadow:0 0 0 1px #ffffff18,0 30px 90px #10b98155;background:#fff}
canvas{width:100%;height:100%;display:block}
.bar,.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
button{font:700 14px "Inter Tight",system-ui,sans-serif;padding:12px 20px;border-radius:999px;border:1px solid #ffffff2a;background:#ffffff10;color:#f4f4f5;cursor:pointer;transition:.2s}
button:hover{background:#ffffff20}
button.p{background:#f4f4f5;color:#09090b;border-color:#f4f4f5}
button.p:hover{box-shadow:0 0 30px #34d399aa}
.up{font:700 14px "Inter Tight",system-ui,sans-serif;padding:12px 20px;border-radius:999px;border:1px solid #34d39966;background:#34d39922;color:#f4f4f5;cursor:pointer}.up:hover{background:#34d39940}#logoPrev{width:44px;height:44px;border-radius:12px;object-fit:cover;border:1px solid #ffffff30}
button:disabled{opacity:.5;cursor:wait}
.hide{display:none!important}
select,input{font:600 14px "Inter Tight",system-ui,sans-serif;padding:11px 14px;border-radius:999px;border:1px solid #ffffff2a;background:#ffffff10;color:#f4f4f5;outline:none}
select option{color:#111}input{width:190px}input::placeholder{color:#8fa79d}
#msg{min-height:18px;font-size:13px;color:#9fd8c0;text-align:center}
</style>
</head>
<body>
<div class="stage"><canvas id="cv"></canvas></div>
<div id="login" class="row hide">
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button id="signin">Sign in</button>
  <button id="google">Google</button>
</div>
<div class="row">
  <label class="up" for="logoFile">Upload logo</label><input id="logoFile" type="file" accept="image/*" hidden>
  <img id="logoPrev" class="hide" alt="Logo preview"><button id="logoClear" class="hide">Remove logo</button><span id="logoMsg" style="font-size:13px;color:#ff8a8a"></span>
</div>
<div class="row">
  <select id="voice" aria-label="Voiceover"><option value="rex">Voiceover: Rex (male)</option><option value="sal">Voiceover: Sal (male)</option><option value="leo">Voiceover: Leo (male)</option><option value="none">No voiceover</option></select>
  <select id="sfx" aria-label="Sound effects"><option value="on">Sound effects: On</option><option value="off">Sound effects: Off</option></select>
  <span id="vs" style="font-size:13px;color:#9fd8c0">Sign in to use voiceover</span>
  <button id="out" class="hide">Sign out</button>
</div>
<div id="msg"></div>
<div class="bar">
  <button id="replay">↻ Replay</button>
  <button id="dl" class="p">Download video</button>
  <button id="cp">Copy caption</button>
</div>

    frame(Math.min(i / FPS, T)); const f = new VideoFrame(cv, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) }); ve.encode(f, { keyFrame: i % FPS === 0 }); f.close();
    while (ve.encodeQueueSize > 6) await new Promise(r => setTimeout(r, 8));
    if (i % 10 === 0) { say(`Rendering video… ${Math.round(i / N * 100)}% (keep this tab open)`); await new Promise(r => setTimeout(r)); }
  }
  await ve.flush(); ve.close(); mux.finalize(); if (err) throw err;
  save(new Blob([mux.target.buffer], { type: "video/mp4" }), "haba-ad.mp4");
}
async function exportRT() { // fallback without WebCodecs: real-time recording
  const ac = new AudioContext(), dest = ac.createMediaStreamDestination(), stream = cv.captureStream(30); dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
  const mime = ["video/mp4;codecs=avc1", "video/webm;codecs=vp9,opus", "video/webm"].find(m => MediaRecorder.isTypeSupported(m)) || "", ch = [];
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12e6 }), done = new Promise(r => (rec.onstop = r)); rec.ondataavailable = e => e.data.size && ch.push(e.data);
  await ac.resume(); const base = ac.currentTime + .1; mix(ac, dest, base);
  busy = false; recording = true; t0 = performance.now() + 100; rec.start(); await new Promise(r => setTimeout(r, (T + .5) * 1000)); rec.stop(); await done;
  const type = (mime || "video/webm").split(";")[0]; save(new Blob(ch, { type }), "haba-ad." + (type.includes("mp4") ? "mp4" : "webm"));
}

// ---------- controls ----------
$("replay").onclick = restart; $("voice").onchange = restart; $("sfx").onchange = restart;
$("cp").onclick = async e => {
  const txt = "Meet Haba: a place to share, follow and talk. Post in seconds, like, reply and repost, and get verified so people know it’s really you. Join the conversation at habaapp.co.za #Haba #JoinTheConversation";
  try { await navigator.clipboard.writeText(txt); e.target.textContent = "Copied ✓"; } catch (x) { e.target.textContent = "Copy failed"; }
  setTimeout(() => (e.target.textContent = "Copy caption"), 1600);
};
$("dl").onclick = async e => {
  const btn = e.target; btn.disabled = true; btn.textContent = "Rendering…"; stopAudio();
  try {
    await ensureVoice();
    if (window.VideoEncoder && (window.AudioEncoder || !hasAudio())) { busy = true; await exportMP4(); }
    else if (window.MediaRecorder && cv.captureStream) await exportRT();
    else throw new Error("this browser can't export video. Try Chrome.");
    say("Video saved" + (hasAudio() ? " with sound." : "."));
  } catch (x) { say("Export failed: " + (x.message || x), 1); }
  finally { busy = false; recording = false; btn.disabled = false; btn.textContent = "Download video"; t0 = performance.now(); }
};
function loop() {
  const el = Math.max(0, (performance.now() - t0) / 1000);
  if (!busy) frame(recording || audioMode ? Math.min(el, T) : Math.min(el % (T + .9), T));
  requestAnimationFrame(loop);
}
Promise.race([Promise.all([document.fonts.load('600 100px "Inter Tight"'), document.fonts.load('700 26px "JetBrains Mono"')]), new Promise(r => setTimeout(r, 2500))]).finally(() => { t0 = performance.now(); loop(); });
</script>
