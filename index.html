<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0a0f0d;color:#f4f4f5;font-family:"Inter Tight",system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px)}
.stage{width:min(100%,calc((100vh - 110px) * 16 / 9));aspect-ratio:16/9;border-radius:18px;overflow:hidden;box-shadow:0 0 0 1px #ffffff18,0 30px 90px #10b98155;background:#fff}
canvas{width:100%;height:100%;display:block}
.bar,.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
button{font:700 14px "Inter Tight",system-ui,sans-serif;padding:12px 20px;border-radius:999px;border:1px solid #ffffff2a;background:#ffffff10;color:#f4f4f5;cursor:pointer;transition:.2s}
button:hover{background:#ffffff20}
button.p{background:#f4f4f5;color:#09090b;border-color:#f4f4f5}
button.p:hover{box-shadow:0 0 30px #34d399aa}
button:disabled{opacity:.5;cursor:wait}
.hide{display:none!important}
select,input{font:600 14px "Inter Tight",system-ui,sans-serif;padding:11px 14px;border-radius:999px;border:1px solid #ffffff2a;background:#ffffff10;color:#f4f4f5;outline:none}
select option{color:#111}input{width:190px}input::placeholder{color:#8fa79d}
#msg{min-height:18px;font-size:13px;color:#9fd8c0;text-align:center}
</style>
</head>

  <button id="out" class="hide">Sign out</button>
</div>
<div id="msg"></div>
<div class="bar">
  <button id="replay">↻ Replay</button>
  <button id="dl" class="p">Download video</button>
  <button id="cp">Copy caption</button>
</div>
