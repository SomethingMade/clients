<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haba Shell · Ad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#000;--fg:#f4f4f5;--ok:#6ee7b7}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:"Inter",system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.stage{width:min(100%,calc((100vh - 140px)*1.7778));aspect-ratio:16/9;border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px #ffffff10,0 40px 100px #000c;background:#000}
canvas{width:100%;height:100%;display:block}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font:600 13px "Inter",system-ui,sans-serif;padding:11px 18px;border-radius:999px;border:1px solid #ffffff18;background:#ffffff08;color:#e5e5e5;cursor:pointer;transition:.2s}
button:hover{background:#ffffff14}
button.p{background:#fff;color:#000;border-color:#fff}
button:disabled{opacity:.45;cursor:wait}
#msg{min-height:18px;font-size:12px;color:var(--ok);text-align:center}
</style>
</head>
<body>
<div class="stage"><canvas id="cv" width="1920" height="1080"></canvas></div>
<div id="msg"></div>
<div class="bar">
  <button id="replay">↻ Replay</button>
  <button id="dl" class="p">Download video</button>
  <button id="cp">Copy caption</button>
</div>
<script>
const W=1920,H=1080,cv=document.getElementById("cv"),c=cv.getContext("2d");
const SANS='"Inter",system-ui,sans-serif',MONO='"JetBrains Mono",Menlo,monospace';
const OR="255,74,28",ORH="#ff4a1c";
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),lerp=(a,b,t)=>a+(b-a)*t;
const oc=t=>1-Math.pow(1-clamp(t),3),oe=t=>{t=clamp(t);return t>=1?1:1-Math.pow(2,-10*t)};
const io=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const rr=(x,y,w,h,r)=>{c.beginPath();c.roundRect?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h)};
const blur=px=>{try{c.filter=px>.3?`blur(${px}px)`:"none"}catch(e){}};

// blur-in word line, centred. words=[[text,color]]
function words(ws,cx,cy,size,t,t0,wt=500,gap=.22){
  F(wt,size);const sp=size*.3,m=ws.map(([s])=>c.measureText(s).width),tot=m.reduce((a,b)=>a+b,0)+sp*(ws.length-1);
  let x=cx-tot/2;
  ws.forEach(([s,col],i)=>{const p=oe(seg(t,t0+i*gap,t0+i*gap+.7));
    if(p>0){c.save();c.globalAlpha=p;blur((1-p)*16);c.fillStyle=col;F(wt,size);c.textAlign="left";c.textBaseline="middle";c.fillText(s,x,cy+(1-p)*size*.4);c.restore()}
    x+=m[i]+sp});
}
function F(w,s,fam=SANS){c.font=`${w} ${s}px ${fam}`;c.letterSpacing=(-s*.02)+"px"}
function txt(s,x,y,size,col,w=600,al="center",fam=SANS){F(w,size,fam);c.textAlign=al;c.textBaseline="middle";c.fillStyle=col;c.fillText(s,x,y)}

// ---------- mini card faces ----------
function face(k,x,y,w,h){
  c.save();rr(x,y,w,h,Math.min(w,h)*.06);c.clip();
  if(k===0){c.fillStyle="#0b0b0f";c.fillRect(x,y,w,h);["#ff5f57","#febc2e","#28c840"].forEach((q,i)=>{c.fillStyle=q;c.beginPath();c.arc(x+w*.05+i*w*.035,y+h*.07,h*.016,0,7);c.fill()});
    ["npm install express","haba run dev","✓ Compiled in 180ms"].forEach((s,i)=>txt(s,x+w*.06,y+h*(.26+i*.14),h*.06,i==2?"#34d399":"#e5e5e5",500,"left",MONO))}
  else if(k===1){c.fillStyle="#fff";c.fillRect(x,y,w,h);txt("haba deploy",x+w/2,y+h*.42,h*.1,"#111",700);txt("→ my-app.web.app",x+w/2,y+h*.6,h*.06,ORH,500,"center",MONO)}
  else if(k===2){const g=c.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,"#e8ecff");g.addColorStop(1,"#ffd9cc");c.fillStyle=g;c.fillRect(x,y,w,h);txt("git push",x+w/2,y+h/2,h*.13,"#111",700)}
  else if(k===3){c.fillStyle="#111418";c.fillRect(x,y,w,h);c.fillStyle="#34d399";rr(x+w*.3,y+h*.4,w*.4,h*.2,h*.1);c.fill();txt("Haba Shell",x+w/2,y+h/2,h*.07,"#000",700)}
  else if(k===4){c.fillStyle="#fff";c.fillRect(x,y,w,h);txt("npm i firebase",x+w/2,y+h/2,h*.09,"#111",600,"center",MONO)}
  else{c.fillStyle="#d4121f";c.fillRect(x,y,w,h);txt("Run · Install · Commit",x+w/2,y+h/2,h*.08,"#fff",700)}
  c.restore()}

// ---------- scenes ----------
function s1(t){c.fillStyle="#fff";c.fillRect(0,0,W,H);
  const a=1-seg(t,3.6,4.1);c.globalAlpha=a;
  if(t<1.5)words([["Welcome","#111"]],W/2,H/2,44,t,.1);
  else if(t<2.5)words([["to","#111"],["the","#111"]],W/2,H/2,44,t,1.5);
  else words([["to","#111"],["the","#111"],["Haba","#111"],["Shell",ORH]],W/2,H/2,44,t,2.5,500,.28);
  c.globalAlpha=1}

function wave(t,a=1,col=OR,lw=16){c.save();c.lineCap="round";c.strokeStyle=`rgba(${col},${a})`;c.lineWidth=lw;c.shadowColor=`rgba(${col},.9)`;c.shadowBlur=50;
  c.beginPath();for(let x=-20;x<=W+20;x+=20){const y=H/2+Math.sin(x*.004+t*2.2)*55+Math.sin(x*.011-t*1.3)*22;x<0?c.moveTo(x,y):c.lineTo(x,y)}c.stroke();c.restore()}

function s2(t){c.fillStyle="#050505";c.fillRect(0,0,W,H);
  const g=c.createRadialGradient(W/2,H/2,0,W/2,H/2,900);g.addColorStop(0,"rgba(255,74,28,.12)");g.addColorStop(1,"rgba(0,0,0,0)");c.fillStyle=g;c.fillRect(0,0,W,H);
  wave(t,.95);
  // dashed grid
  c.save();c.setLineDash([10,10]);c.strokeStyle="rgba(255,255,255,.55)";c.lineWidth=2;
  const gp=oe(seg(t,0,.7)),bx=lerp(780,330,io(seg(t,.5,1.4))),by=lerp(400,200,io(seg(t,.5,1.4)));
  [bx,W-bx].forEach(x=>{c.beginPath();c.moveTo(x,0);c.lineTo(x,H*gp);c.stroke()});
  [by,H-by].forEach(y=>{c.beginPath();c.moveTo(0,y);c.lineTo(W*gp,y);c.stroke()});c.restore();
  // frame
  const fx=bx,fy=by,fw=W-bx*2,fh=H-by*2,sl=io(seg(t,2.3,3.0))+io(seg(t,3.4,4.1))*1+io(seg(t,4.5,5.0)),pw=fw;
  const sq=1+.04*Math.sin(Math.PI*clamp(sl%1));
  c.save();rr(fx,fy,fw,fh,28);c.clip();
  c.translate(-sl*pw,0);
  // panel0 red collage
  c.fillStyle="#d4121f";c.fillRect(fx,fy,fw,fh);
  for(let i=0;i<9;i++){const p=oe(seg(t,.9+i*.08,1.6+i*.08)),px=fx+40+(i%5)*(fw/5.3),py=fy+(i<5?30:fh-250);c.save();c.globalAlpha=p;c.translate(0,(1-p)*40);face(i%6,px,py,150,200);c.restore()}
  txt("Where do great ideas actually run?",fx+fw/2,fy+fh/2,36,"#fff",700);
  // panel1 terminal
  c.fillStyle="#0b0b0f";c.fillRect(fx+pw,fy,fw,fh);
  [["❯ npm install express","#e5e5e5"],["added 58 packages in 2s","#737373"],["❯ haba run dev","#e5e5e5"],["▲ Server ready  http://localhost:3000","#34d399"],["✓ Compiled in 180ms","#34d399"]].forEach(([s,col],i)=>txt(s,fx+pw+70,fy+110+i*70,30,col,500,"left",MONO));
  // panel2 white features
  c.fillStyle="#fff";c.fillRect(fx+pw*2,fy,fw,fh);
  ["Run","Install","Commit","Deploy"].forEach((s,i)=>{const x=fx+pw*2+fw*(.14+i*.24);rr(x-90,fy+fh/2-90,180,180,36);c.fillStyle=i==3?ORH:"#f3f3f3";c.fill();txt(s,x,fy+fh/2,34,i==3?"#fff":"#111",700)});
  // panel3 deploy
  c.fillStyle="#0b0b0f";c.fillRect(fx+pw*3,fy,fw,fh);txt("✓ Deployed in 4.1s",fx+pw*3+fw/2,fy+fh/2-30,56,"#34d399",700);txt("my-app.web.app",fx+pw*3+fw/2,fy+fh/2+50,34,"#e5e5e5",500,"center",MONO);
  c.restore();
  c.save();c.setLineDash([10,10]);c.strokeStyle="rgba(255,255,255,.7)";c.lineWidth=2.5;rr(fx,fy,fw,fh,28);c.stroke();c.restore()}

function s3(t){c.fillStyle="#000";c.fillRect(0,0,W,H);
  c.save();blur(70);c.globalAlpha=.55;c.fillStyle="#b9b2b0";c.translate(W/2,H/2);c.rotate(.55);c.fillRect(-90+Math.sin(t*1.2)*120,-900,220,1800);c.restore();
  c.save();const a=oe(seg(t,.1,.8));words([["Got","#fff"],["a","#fff"],["command","#fff"],["in","#fff"],["mind?","#fff"]],W/2,H/2,46,t,.1,600,.16);c.restore()}

const BASE=[[-.5,-.3,0],[0,-.35,1],[.45,-.2,2],[-.4,.15,3],[.05,.1,4],[.5,.25,5],[-.1,.38,0],[.3,.4,1]];
function s4(t){c.fillStyle="#000";c.fillRect(0,0,W,H);
  const g=c.createRadialGradient(W*.7,H*.4,0,W*.7,H*.4,1100);g.addColorStop(0,"rgba(120,30,10,.55)");g.addColorStop(1,"rgba(0,0,0,0)");c.fillStyle=g;c.fillRect(0,0,W,H);
  const z=1+.35*io(seg(t,0,5.5));
  c.save();c.translate(W/2,H/2);c.scale(z,z);
  BASE.forEach(([bx,by,k],i)=>{const p=oe(seg(t,i*.22,i*.22+.9));if(p<=0)return;
    const w=520,h=300,x=bx*W*.85+Math.sin(t*.9+i)*30,y=by*H*.85+Math.cos(t*.8+i*2)*24+(1-p)*160;
    c.save();c.globalAlpha=p;c.translate(x,y);c.transform(1,-.18,.12,1,0,0);c.rotate(Math.sin(t*.5+i)*.05);
    c.shadowColor=`rgba(${OR},.95)`;c.shadowBlur=55;c.lineWidth=4;c.strokeStyle=ORH;rr(-w/2,-h/2,w,h,22);c.fillStyle="#111";c.fill();c.stroke();c.shadowBlur=0;
    face(k,-w/2,-h/2,w,h);c.restore()});
  c.restore()}

function s5(t){c.fillStyle="#fff";c.fillRect(0,0,W,H);
  const a=1-seg(t,3.7,4.1);c.globalAlpha=a;
  words([["Let’s","#111"],["bring","#111"],["your","#111"],["code","#111"],["to","#111"],["life",ORH]],W/2,H/2,48,t,.2,500,.3);c.globalAlpha=1}

function s6(t){c.fillStyle="#000";c.fillRect(0,0,W,H);
  const p=oe(seg(t,.2,1.1)),y=lerp(H/2-70,H/2,io(seg(t,1.6,2.4)));
  c.save();c.globalAlpha=p;c.shadowColor="rgba(255,255,255,.9)";c.shadowBlur=40*p;blur((1-p)*14);txt("Haba Shell.",W/2,y,84,"#fff",700);c.restore();
  const q=oe(seg(t,2.2,2.9));if(q>0){c.save();c.globalAlpha=q;txt("A real terminal. Right inside Haba Code.",W/2,y+80,26,"#8a8a8a",500);c.restore()}}

// ---------- compositor ----------
const SC=[[s1,4.2],[s2,5.4],[s3,3.2],[s4,5.8],[s5,4.2],[s6,3.8]];
let T=0;const ST=SC.map(([f,d])=>{const s=T;T+=d;return[s,T,f]});
function frame(t){c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;blur(0);c.fillStyle="#000";c.fillRect(0,0,W,H);
  for(const[a,b,f]of ST)if(t>=a&&t<=b){f(t-a);break}
  c.globalAlpha=1;blur(0);c.letterSpacing="0px"}

// ---------- controls ----------
const $=id=>document.getElementById(id),say=s=>$("msg").textContent=s||"";
let t0=performance.now(),busy=false;
const save=(blob,name)=>{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click()};
async function exportMP4(){const{Muxer,ArrayBufferTarget}=await import("https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.0/+esm");const FPS=30,dur=T+.25;let err=null;
  const mux=new Muxer({target:new ArrayBufferTarget(),video:{codec:"avc",width:W,height:H,frameRate:FPS},fastStart:"in-memory"});
  const ve=new VideoEncoder({output:(ch,m)=>mux.addVideoChunk(ch,m),error:e=>(err=e)});ve.configure({codec:"avc1.640028",width:W,height:H,bitrate:8e6,framerate:FPS});
  const N=Math.ceil(dur*FPS);
  for(let i=0;i<N;i++){frame(Math.min(i/FPS,T-.001));const f=new VideoFrame(cv,{timestamp:Math.round(i*1e6/FPS),duration:Math.round(1e6/FPS)});ve.encode(f,{keyFrame:i%FPS===0});f.close();while(ve.encodeQueueSize>6)await new Promise(r=>setTimeout(r,6));if(i%12===0){say(`Rendering… ${Math.round(i/N*100)}%`);await new Promise(r=>setTimeout(r))}}
  await ve.flush();ve.close();mux.finalize();if(err)throw err;save(new Blob([mux.target.buffer],{type:"video/mp4"}),"haba-shell-ad.mp4")}
async function exportRT(){const stream=cv.captureStream(30),mime=["video/mp4;codecs=avc1","video/webm;codecs=vp9","video/webm"].find(m=>MediaRecorder.isTypeSupported(m))||"",ch=[];
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:10e6}),done=new Promise(r=>(rec.onstop=r));rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
  busy=false;t0=performance.now()+80;rec.start();await new Promise(r=>setTimeout(r,(T+.4)*1000));rec.stop();await done;
  const type=(mime||"video/webm").split(";")[0];save(new Blob(ch,{type}),"haba-shell-ad."+(type.includes("mp4")?"mp4":"webm"))}
$("replay").onclick=()=>{t0=performance.now()};
$("cp").onclick=async e=>{try{await navigator.clipboard.writeText("Haba Shell — a real terminal inside Haba Code. Run, install, commit & deploy without leaving the browser. #HabaShell #HabaCode");e.target.textContent="Copied ✓"}catch(x){e.target.textContent="Copy failed"}setTimeout(()=>(e.target.textContent="Copy caption"),1500)};
$("dl").onclick=async e=>{const b=e.target;b.disabled=true;b.textContent="Rendering…";
  try{if(window.VideoEncoder){busy=true;await exportMP4()}else if(window.MediaRecorder&&cv.captureStream)await exportRT();else throw new Error("Use Chrome for best results");say("Video saved.")}
  catch(x){say("Export failed: "+(x.message||x))}finally{busy=false;b.disabled=false;b.textContent="Download video";t0=performance.now()}};
function loop(){const el=Math.max(0,(performance.now()-t0)/1000);if(!busy)frame(Math.min(el%(T+.8),T-.001));requestAnimationFrame(loop)}
Promise.race([Promise.all([document.fonts.load('500 44px "Inter"'),document.fonts.load('700 84px "Inter"'),document.fonts.load('500 20px "JetBrains Mono"')]),new Promise(r=>setTimeout(r,2000))]).finally(()=>{t0=performance.now();loop()});
</script>
</body>
</html>
