<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Silo — Client Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F4EF;
    --surface:#FFFFFF;
    --surface-2:#F0ECE3;
    --border:#E2DDCF;
    --border-soft:#EBE7DC;
    --text:#1C1B18;
    --text-muted:#6E6B62;
    --text-dim:#A6A196;
    --accent:#C89B4A;
    --accent-text:#8A6F3A;
    --accent-dim:#8A6F3A;
    --accent-glow:rgba(200,155,74,0.14);
    --danger:#B84D3F;
    --danger-glow:rgba(184,77,63,0.10);
    --ok:#4F8C5B;
    --radius:10px;
    --radius-sm:6px;
    --font-display:'Michroma', sans-serif;
    --font-body:'Inter', -apple-system, sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    height:100%;
    -webkit-font-smoothing:antialiased;
  }

  body{
    background-image:
      linear-gradient(var(--border-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--border-soft) 1px, transparent 1px);
    background-size:48px 48px;
    background-attachment:fixed;
    min-height:100vh;
  }

  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}
  ::selection{background:var(--accent-glow); color:var(--text);}
  .hidden{display:none !important;}
  .mono{font-family:var(--font-mono);}

  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:10px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-dim);}

  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  /* ---------- Shared: card / login ---------- */
  .center-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .card{
    width:100%;
    max-width:400px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:36px 32px;
  }

  .mark{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:28px;
  }
  .mark svg{width:20px; height:26px; flex-shrink:0;}
  .mark span{font-family:var(--font-display); font-size:14px; letter-spacing:0.12em;}

  .sub{color:var(--text-muted); font-size:13px; line-height:1.6; margin-bottom:24px;}

  .tabs{display:flex; gap:4px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:3px; margin-bottom:22px;}
  .tab{flex:1; text-align:center; padding:8px; font-size:12.5px; font-weight:600; color:var(--text-muted); border-radius:4px; background:transparent; border:none;}
  .tab.active{background:var(--surface-2); color:var(--text);}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); margin-bottom:8px;}
  .field input, .field select, .field textarea{
    width:100%; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:11px 12px; color:var(--text); font-size:14px; font-family:var(--font-body);
    transition:border-color 0.15s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent-dim);}
  .field textarea{resize:vertical; min-height:80px;}
  .field input:disabled{opacity:0.6;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:11px 18px; border-radius:var(--radius-sm); border:1px solid transparent;
    font-size:13px; font-weight:600; letter-spacing:0.01em; transition:all 0.15s ease;
  }
  .btn-primary{background:var(--accent); color:#151108; width:100%;}
  .btn-primary:hover{background:#D6AA57;}
  .btn-primary:disabled{opacity:0.5; cursor:not-allowed;}

  .btn-ghost{background:transparent; border-color:var(--border); color:var(--text);}
  .btn-ghost:hover{border-color:var(--text-dim); background:var(--surface-2);}

  .btn-danger{background:transparent; border-color:var(--danger); color:var(--danger);}
  .btn-danger:hover{background:var(--danger-glow);}

  .error-box{
    background:var(--danger-glow); border:1px solid var(--danger); color:#E8A99F;
    font-size:12.5px; padding:10px 12px; border-radius:var(--radius-sm); margin-bottom:16px; line-height:1.5;
  }

  .btn-google{
    width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
    padding:11px 16px; font-size:13.5px; font-weight:500; margin-bottom:20px;
  }
  .btn-google:hover{border-color:var(--text-dim); background:var(--surface-2);}
  .btn-google svg{width:17px; height:17px; flex-shrink:0;}
  .btn-google:disabled{opacity:0.5; cursor:not-allowed;}

  .divider{display:flex; align-items:center; gap:12px; margin-bottom:20px; color:var(--text-dim); font-size:11px; text-transform:uppercase; letter-spacing:0.06em;}
  .divider::before, .divider::after{content:''; flex:1; height:1px; background:var(--border-soft);}

  .foot-note{margin-top:20px; padding-top:18px; border-top:1px solid var(--border-soft); font-size:11px; color:var(--text-dim); text-align:center; letter-spacing:0.03em; line-height:1.6;}

  /* ---------- App header ---------- */
  #appShell{min-height:100vh;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 32px; border-bottom:1px solid var(--border);
    background:rgba(246,244,239,0.75); backdrop-filter:blur(8px);
    position:sticky; top:0; z-index:10;
  }
  .topbar-mark{display:flex; align-items:center; gap:9px;}
  .topbar-mark svg{width:17px; height:22px;}
  .topbar-mark span{font-family:var(--font-display); font-size:13px; letter-spacing:0.12em;}
  .topbar-user{display:flex; align-items:center; gap:14px;}
  .topbar-email{font-size:12.5px; color:var(--text-muted);}
  .signout-btn{font-size:11.5px; color:var(--text-dim); background:none; border:none; text-decoration:underline; text-underline-offset:2px;}
  .signout-btn:hover{color:var(--text-muted);}

  .main{max-width:760px; margin:0 auto; padding:40px 24px 80px;}

  .page-title{font-family:var(--font-display); font-size:18px; letter-spacing:0.03em; margin-bottom:6px;}
  .page-sub{font-size:13px; color:var(--text-muted); line-height:1.5; margin-bottom:28px;}

  /* ---------- Gated dashboard (greyed skeleton + overlay) ---------- */
  .gated-wrap{position:relative;}
  .gated-backdrop{opacity:0.32; filter:grayscale(0.7) blur(0.3px); pointer-events:none; user-select:none;}

  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:24px;}
  .stat-card{background:var(--surface); padding:18px 20px;}
  .stat-label{font-size:11px; text-transform:uppercase; letter-spacing:0.07em; color:var(--text-muted); margin-bottom:10px;}
  .stat-value{font-family:var(--font-mono); font-size:22px; font-weight:600;}
  .stat-value.accent{color:var(--accent-text);}

  .skeleton-block{height:14px; background:var(--surface-2); border-radius:4px; margin-bottom:8px;}
  .skeleton-block.w60{width:60%;}
  .skeleton-block.w40{width:40%;}

  @media (max-width:600px){ .stat-grid{grid-template-columns:1fr;} }

  .gated-overlay{
    position:absolute; inset:0; display:flex; align-items:flex-start; justify-content:center;
    padding-top:20px;
  }
  .gated-card{
    width:100%; max-width:440px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:28px 26px; box-shadow:0 20px 50px rgba(28,27,24,0.12);
  }
  .gated-card-title{font-size:15px; font-weight:600; margin-bottom:8px;}
  .gated-card-sub{font-size:12.5px; color:var(--text-muted); line-height:1.6; margin-bottom:20px;}

  .status-banner{
    display:flex; align-items:center; gap:10px; padding:12px 14px;
    border-radius:var(--radius-sm); font-size:12.5px; margin-bottom:4px;
  }
  .status-banner.pending{background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted);}
  .status-banner.rejected{background:var(--danger-glow); border:1px solid var(--danger); color:#E8A99F;}
  .status-banner.suspended{background:var(--danger-glow); border:1px solid var(--danger); color:#E8A99F;}
  .status-dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
  .status-dot.pending{background:var(--text-dim);}
  .status-dot.rejected{background:var(--danger);}

  .plan-options{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .plan-opt{border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 8px; text-align:center; font-size:12px; background:var(--bg); transition:all 0.15s ease;}
  .plan-opt:hover{border-color:var(--text-dim);}
  .plan-opt.selected{border-color:var(--accent-text); background:var(--accent-glow); color:var(--accent-text);}
  .plan-opt .plan-opt-quota{font-family:var(--font-mono); font-size:11px; color:var(--text-dim); margin-top:3px;}
  .plan-opt.selected .plan-opt-quota{color:var(--accent-text);}

  /* ---------- Approved dashboard ---------- */
  .silo-viz{position:relative; width:52px; height:80px; flex-shrink:0;}
  .silo-viz svg{position:absolute; inset:0; width:100%; height:100%;}

  .silo-hero{display:flex; align-items:center; gap:20px; padding:22px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:24px;}
  .silo-hero-stats{flex:1;}
  .silo-hero-name{font-size:16px; font-weight:600; margin-bottom:4px;}
  .silo-hero-plan{font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:12px;}
  .silo-hero-bytes{font-size:13px; color:var(--text-muted);}
  .silo-hero-bytes b{color:var(--text); font-weight:600;}

  .detail-section{margin-bottom:26px;}
  .detail-section-title{font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-dim); margin-bottom:14px;}
  .detail-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border-soft); font-size:13px;}
  .detail-row:last-child{border-bottom:none;}
  .detail-row-label{color:var(--text-muted);}
  .detail-row-value{font-family:var(--font-mono); font-size:12.5px;}

  .apikey-box{background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px; font-family:var(--font-mono); font-size:12.5px; word-break:break-all; color:var(--accent-text); margin:12px 0;}
  .apikey-warning{background:var(--danger-glow); border:1px solid var(--danger); color:#E8A99F; font-size:11.5px; padding:10px 12px; border-radius:var(--radius-sm); line-height:1.5; margin-bottom:14px;}
  .copy-btn{font-size:11px; color:var(--text-muted); background:var(--surface-2); border:1px solid var(--border); padding:6px 10px; border-radius:var(--radius-sm);}
  .copy-btn:hover{color:var(--text); border-color:var(--text-dim);}

  /* ---------- Modal ---------- */
  .modal-overlay{position:fixed; inset:0; background:rgba(6,6,7,0.7); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .modal{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); width:100%; max-width:420px; max-height:90vh; overflow-y:auto;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:20px 22px; border-bottom:1px solid var(--border-soft);}
  .modal-title{font-size:15px; font-weight:600;}
  .modal-close{background:none; border:none; color:var(--text-muted); font-size:18px; line-height:1; padding:4px;}
  .modal-close:hover{color:var(--text);}
  .modal-body{padding:22px;}
  .modal-foot{padding:16px 22px; border-top:1px solid var(--border-soft); display:flex; gap:10px; justify-content:flex-end;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--surface-2); border:1px solid var(--border); padding:11px 18px; border-radius:var(--radius-sm);
    font-size:12.5px; z-index:200; display:flex; align-items:center; gap:8px; box-shadow:0 8px 24px rgba(28,27,24,0.18);
  }
  .toast-dot{width:6px; height:6px; border-radius:50%; background:var(--ok);}
  .toast.err .toast-dot{background:var(--danger);}

  .loading-dots{display:flex; gap:5px; justify-content:center; padding:60px 0;}
  .loading-dots span{width:7px; height:7px; border-radius:50%; background:var(--accent); animation:blink 1.2s ease-in-out infinite;}
  .loading-dots span:nth-child(2){animation-delay:0.15s;}
  .loading-dots span:nth-child(3){animation-delay:0.3s;}
  @keyframes blink{0%,80%,100%{opacity:0.25;} 40%{opacity:1;}}

  @media (max-width:600px){
    .topbar{padding:14px 18px;}
    .main{padding:28px 16px 60px;}
  }
</style>
</head>
<body>

<!-- ============ LOGIN / SIGNUP SCREEN ============ -->
<div id="loginScreen" class="center-screen">
  <div class="card">
    <div class="mark">
      <svg viewBox="0 0 20 26" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 6C2 3.79 5.58 2 10 2C14.42 2 18 3.79 18 6V18C18 21.31 14.42 24 10 24C5.58 24 2 21.31 2 18V6Z" stroke="#C89B4A" stroke-width="1.4"/>
        <ellipse cx="10" cy="6" rx="8" ry="4" stroke="#C89B4A" stroke-width="1.4"/>
        <path d="M2 12H18" stroke="#C89B4A" stroke-width="1" opacity="0.4"/>
      </svg>
      <span>SILO</span>
    </div>
    <p class="sub" id="loginSub">Sign in to manage your storage workspace, or create an account to apply for one.</p>

    <div class="tabs">
      <button type="button" class="tab active" id="tabSignIn">Sign in</button>
      <button type="button" class="tab" id="tabSignUp">Create account</button>
    </div>

    <div id="loginError" class="error-box hidden"></div>

    <button type="button" id="googleBtn" class="btn btn-google" style="display:flex; align-items:center; justify-content:center; gap:10px;">
      <svg viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 01-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 009 18z"/>
        <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 013.68 9c0-.59.1-1.17.27-1.7V4.97H.96A9 9 0 000 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 00.96 4.97L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z"/>
      </svg>
      <span id="googleBtnLabel">Continue with Google</span>
    </button>
    <div class="divider">or</div>

    <form id="authForm">
      <div class="field">
        <label for="authEmail">Email</label>
        <input type="email" id="authEmail" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="authPassword">Password</label>
        <input type="password" id="authPassword" autocomplete="current-password" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary" id="authSubmitBtn">Sign in</button>
    </form>
    <div class="foot-note">A Silo, a Vynix company product.<br>Storage-as-a-service — usage-based billing.</div>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="appShell" class="hidden">
  <div class="topbar">
    <div class="topbar-mark">
      <svg viewBox="0 0 20 26" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 6C2 3.79 5.58 2 10 2C14.42 2 18 3.79 18 6V18C18 21.31 14.42 24 10 24C5.58 24 2 21.31 2 18V6Z" stroke="#C89B4A" stroke-width="1.4"/>
        <ellipse cx="10" cy="6" rx="8" ry="4" stroke="#C89B4A" stroke-width="1.4"/>
      </svg>
      <span>SILO</span>
    </div>
    <div class="topbar-user">
      <span class="topbar-email" id="topbarEmail">—</span>
      <button class="signout-btn" id="signOutBtn">Sign out</button>
    </div>
  </div>

  <main class="main">
    <div id="dashboardRoot"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>

<script>
/* ============================================================
   SILO — CLIENT DASHBOARD
   ============================================================
   Auth model: anyone can create an account (email/password or
   Google) — account creation does NOT grant workspace access.

   A client's access is entirely driven by two Firestore reads,
   scoped to their own auth uid:
     1. companies where authUid == uid   -> their provisioned workspace
     2. applications where applicantUid == uid -> their signup request(s)

   If (1) exists and status is 'active', the real dashboard renders.
   Otherwise the dashboard renders in a greyed-out/disabled state with
   an overlay card showing either the "apply for storage" form (no
   application yet), a pending-review banner, or a rejected banner
   with the option to re-apply. This mirrors the Silo Admin Console's
   Applications tab, which is what reviews and approves these docs —
   see that console for the exact `applications` schema it expects.

   REQUIRED Firestore security rules (not included in this file —
   add to firestore.rules):
     match /applications/{id} {
       allow create: if request.auth != null
                      && request.resource.data.applicantUid == request.auth.uid
                      && request.resource.data.status == 'pending';
       allow read: if request.auth != null
                   && (resource.data.applicantUid == request.auth.uid || isAdmin());
       allow update, delete: if isAdmin(); // only the admin console approves/rejects
     }
     match /companies/{id} {
       allow read: if request.auth != null
                    && (resource.data.authUid == request.auth.uid || isAdmin());
       // API key rotation from this dashboard needs a narrow allow, e.g.:
       allow update: if request.auth != null
                      && resource.data.authUid == request.auth.uid
                      && request.resource.data.diff(resource.data).affectedKeys()
                           .hasOnly(['apiKeyHash','apiKeyPrefix','apiKeyCreatedAt']);
     }
   ============================================================ */

// ---------- Firebase config (same project as the admin console) ----------
const firebaseConfig = {
  apiKey: "AIzaSyBQSPwpVbGrdCuOoyitAeWQHIeipj2MgIY",
  authDomain: "newstart-64c43.firebaseapp.com",
  databaseURL: "https://newstart-64c43-default-rtdb.firebaseio.com",
  projectId: "newstart-64c43",
  storageBucket: "newstart-64c43.firebasestorage.app",
  messagingSenderId: "941619830061",
  appId: "1:941619830061:web:de9e0f791eb8f6eacf87a4",
  measurementId: "G-7064P2RFHN"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ---------- Plans (mirrors the admin console) ----------
const GB = 1024 ** 3;
const TB = 1024 ** 4;
const PLANS = {
  starter: { label: 'Starter',  quotaBytes: 100 * GB, pricePerGb: 1.60 },
  growth:  { label: 'Growth',   quotaBytes: 1 * TB,   pricePerGb: 1.25 },
  scale:   { label: 'Scale',    quotaBytes: 5 * TB,   pricePerGb: 0.90 },
  custom:  { label: 'Custom',   quotaBytes: null,     pricePerGb: 1.10 }
};

// ---------- State ----------
let authMode = 'signin'; // 'signin' | 'signup'
let myCompany = null;         // company doc where authUid == uid, or null
let myApplications = [];      // all application docs for this uid
let unsubCompany = null;
let unsubApplications = null;
let applyPlanKey = 'starter';

// ---------- Helpers ----------
function formatBytes(bytes) {
  if (bytes === 0 || bytes == null) return '0 GB';
  if (bytes >= TB) return (bytes / TB).toFixed(2).replace(/\.00$/, '') + ' TB';
  if (bytes >= GB) return (bytes / GB).toFixed(1).replace(/\.0$/, '') + ' GB';
  return (bytes / (1024 ** 2)).toFixed(0) + ' MB';
}

function formatDate(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('en-ZA', { year: 'numeric', month: 'short', day: 'numeric' });
}

function tsToMs(ts) {
  if (!ts) return 0;
  return ts.toDate ? ts.toDate().getTime() : new Date(ts).getTime();
}

function usagePct(company) {
  if (!company || !company.quotaBytes) return 0;
  return Math.min(1, (company.usedBytes || 0) / company.quotaBytes);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

async function sha256Hex(text) {
  const enc = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function randomKeySuffix(len = 32) {
  const bytes = crypto.getRandomValues(new Uint8Array(len));
  return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('').slice(0, len);
}

function toast(message, isError = false) {
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast' + (isError ? ' err' : '');
  el.innerHTML = `<span class="toast-dot"></span><span>${escapeHtml(message)}</span>`;
  root.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function siloSVG(pct) {
  const clamped = Math.max(0, Math.min(1, pct || 0));
  const color = clamped >= 0.9 ? 'var(--danger)' : 'var(--accent)';
  const fillTop = 48 - clamped * 44;
  const shape = "M4,14 Q4,4 17,4 Q30,4 30,14 L30,34 L22,48 L12,48 L4,34 Z";
  return `<svg viewBox="0 0 34 52" xmlns="http://www.w3.org/2000/svg">
    <defs><clipPath id="siloclip"><path d="${shape}"/></clipPath></defs>
    <rect x="0" y="0" width="34" height="52" fill="var(--surface-2)" clip-path="url(#siloclip)"/>
    <rect x="0" y="${fillTop}" width="34" height="${clamped * 44 + 12}" fill="${color}" clip-path="url(#siloclip)"/>
    <path d="${shape}" stroke="var(--border)" stroke-width="1.3" fill="none"/>
  </svg>`;
}

function closeModal() {
  document.getElementById('modalRoot').innerHTML = '';
}

// ---------- Auth: sign in / sign up tabs ----------
const tabSignIn = document.getElementById('tabSignIn');
const tabSignUp = document.getElementById('tabSignUp');
const authSubmitBtn = document.getElementById('authSubmitBtn');
const googleBtnLabel = document.getElementById('googleBtnLabel');
const loginSub = document.getElementById('loginSub');
const authPassword = document.getElementById('authPassword');

function setAuthMode(mode) {
  authMode = mode;
  tabSignIn.classList.toggle('active', mode === 'signin');
  tabSignUp.classList.toggle('active', mode === 'signup');
  authSubmitBtn.textContent = mode === 'signin' ? 'Sign in' : 'Create account';
  googleBtnLabel.textContent = mode === 'signin' ? 'Continue with Google' : 'Sign up with Google';
  loginSub.textContent = mode === 'signin'
    ? 'Sign in to manage your storage workspace, or create an account to apply for one.'
    : 'Create an account, then apply for storage. An operator reviews every application before your workspace is provisioned.';
  authPassword.autocomplete = mode === 'signin' ? 'current-password' : 'new-password';
  document.getElementById('loginError').classList.add('hidden');
}
tabSignIn.addEventListener('click', () => setAuthMode('signin'));
tabSignUp.addEventListener('click', () => setAuthMode('signup'));

const authForm = document.getElementById('authForm');
const loginError = document.getElementById('loginError');

authForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  loginError.classList.add('hidden');
  authSubmitBtn.disabled = true;
  authSubmitBtn.textContent = authMode === 'signin' ? 'Signing in…' : 'Creating account…';
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  try {
    if (authMode === 'signin') {
      await auth.signInWithEmailAndPassword(email, password);
    } else {
      await auth.createUserWithEmailAndPassword(email, password);
    }
    // onAuthStateChanged handles the rest
  } catch (err) {
    loginError.textContent = friendlyAuthError(err);
    loginError.classList.remove('hidden');
    authSubmitBtn.disabled = false;
    authSubmitBtn.textContent = authMode === 'signin' ? 'Sign in' : 'Create account';
  }
});

function friendlyAuthError(err) {
  const code = err.code || '';
  if (code.includes('email-already-in-use')) return 'An account already exists for that email — try signing in instead.';
  if (code.includes('weak-password')) return 'Password should be at least 6 characters.';
  if (code.includes('user-not-found') || code.includes('wrong-password') || code.includes('invalid-credential')) return 'Incorrect email or password.';
  if (code.includes('too-many-requests')) return 'Too many attempts. Try again shortly.';
  if (code.includes('invalid-email')) return 'Enter a valid email address.';
  return 'Something went wrong. Please try again.';
}

const googleBtn = document.getElementById('googleBtn');
googleBtn.addEventListener('click', async () => {
  loginError.classList.add('hidden');
  googleBtn.disabled = true;
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    await auth.signInWithPopup(provider);
    // onAuthStateChanged handles the rest — works for both new and existing accounts
  } catch (err) {
    if (err.code !== 'auth/popup-closed-by-user' && err.code !== 'auth/cancelled-popup-request') {
      loginError.textContent = friendlyAuthError(err);
      loginError.classList.remove('hidden');
    }
  } finally {
    googleBtn.disabled = false;
  }
});

document.getElementById('signOutBtn').addEventListener('click', () => auth.signOut());

// ---------- Auth state ----------
const loginScreen = document.getElementById('loginScreen');
const appShell = document.getElementById('appShell');

auth.onAuthStateChanged((user) => {
  if (!user) {
    showLogin();
    return;
  }
  document.getElementById('topbarEmail').textContent = user.email || '';
  showApp();
  startListeners(user.uid);
});

function showLogin() {
  loginScreen.classList.remove('hidden');
  appShell.classList.add('hidden');
  authSubmitBtn.disabled = false;
  authSubmitBtn.textContent = authMode === 'signin' ? 'Sign in' : 'Create account';
  if (unsubCompany) { unsubCompany(); unsubCompany = null; }
  if (unsubApplications) { unsubApplications(); unsubApplications = null; }
  myCompany = null;
  myApplications = [];
}

function showApp() {
  loginScreen.classList.add('hidden');
  appShell.classList.remove('hidden');
  document.getElementById('dashboardRoot').innerHTML = `<div class="loading-dots"><span></span><span></span><span></span></div>`;
}

// ---------- Firestore listeners scoped to this user ----------
function startListeners(uid) {
  if (unsubCompany) unsubCompany();
  if (unsubApplications) unsubApplications();

  unsubCompany = db.collection('companies').where('authUid', '==', uid)
    .onSnapshot((snap) => {
      myCompany = snap.empty ? null : { id: snap.docs[0].id, ...snap.docs[0].data() };
      renderDashboard();
    }, (err) => {
      console.error('company listener error', err);
      toast('Could not load your workspace.', true);
    });

  unsubApplications = db.collection('applications').where('applicantUid', '==', uid)
    .onSnapshot((snap) => {
      myApplications = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderDashboard();
    }, (err) => {
      console.error('applications listener error', err);
      toast('Could not load your application status.', true);
    });
}

function latestApplication() {
  if (!myApplications.length) return null;
  return [...myApplications].sort((a, b) => tsToMs(b.submittedAt) - tsToMs(a.submittedAt))[0];
}

// ---------- Dashboard render ----------
function renderDashboard() {
  const root = document.getElementById('dashboardRoot');

  if (myCompany && myCompany.status === 'active') {
    root.innerHTML = approvedDashboardHtml(myCompany);
    return;
  }

  if (myCompany && myCompany.status === 'suspended') {
    root.innerHTML = gatedShell(`
      <div class="gated-card">
        <div class="gated-card-title">Workspace suspended</div>
        <div class="gated-card-sub">Your Silo workspace has been suspended. Contact billing@silo.storage if you believe this is a mistake.</div>
      </div>`);
    return;
  }

  const app = latestApplication();

  if (!app || app.status === 'rejected') {
    root.innerHTML = gatedShell(applyCardHtml(app));
    wireApplyForm();
    return;
  }

  if (app.status === 'pending') {
    root.innerHTML = gatedShell(`
      <div class="gated-card">
        <div class="status-banner pending"><span class="status-dot pending"></span>Application under review</div>
        <div class="gated-card-title" style="margin-top:16px;">${escapeHtml(app.companyName || 'Your application')}</div>
        <div class="gated-card-sub">Submitted ${formatDate(app.submittedAt)} for the ${escapeHtml(PLANS[app.requestedPlan]?.label || app.requestedPlan || 'requested')} plan. An operator will review it shortly — this page updates automatically once a decision is made.</div>
      </div>`);
    return;
  }

  if (app.status === 'approved') {
    // Approved but the company doc hasn't synced yet — brief transitional state.
    root.innerHTML = gatedShell(`
      <div class="gated-card">
        <div class="status-banner pending"><span class="status-dot pending"></span>Provisioning your workspace…</div>
        <div class="gated-card-sub">Your application was approved. Setting up your workspace — this should only take a moment.</div>
      </div>`);
    return;
  }

  // Fallback
  root.innerHTML = gatedShell(applyCardHtml(null));
  wireApplyForm();
}

function gatedShell(overlayHtml) {
  return `
    <div class="page-title">Dashboard</div>
    <div class="page-sub">Your Silo storage workspace.</div>
    <div class="gated-wrap">
      <div class="gated-backdrop">
        <div class="stat-grid">
          <div class="stat-card"><div class="stat-label">Plan</div><div class="skeleton-block w60"></div></div>
          <div class="stat-card"><div class="stat-label">Storage used</div><div class="skeleton-block w40"></div></div>
          <div class="stat-card"><div class="stat-label">Quota</div><div class="skeleton-block w60"></div></div>
        </div>
        <div class="silo-hero">
          <div class="silo-viz">${siloSVG(0.2)}</div>
          <div class="silo-hero-stats">
            <div class="skeleton-block w40"></div>
            <div class="skeleton-block w60"></div>
          </div>
        </div>
      </div>
      <div class="gated-overlay">${overlayHtml}</div>
    </div>`;
}

function applyCardHtml(previousApp) {
  return `
    <div class="gated-card">
      ${previousApp && previousApp.status === 'rejected' ? `
        <div class="status-banner rejected"><span class="status-dot rejected"></span>Previous application was not approved</div>
        ${previousApp.rejectionReason ? `<div class="gated-card-sub" style="margin-top:8px; margin-bottom:0;">${escapeHtml(previousApp.rejectionReason)}</div>` : ''}
        <div style="height:16px;"></div>
      ` : ''}
      <div class="gated-card-title">Apply for storage</div>
      <div class="gated-card-sub">Tell us about your company and what you'll be storing. An operator reviews every request before a workspace is provisioned.</div>
      <form id="applyForm">
        <div class="field">
          <label for="applyCompanyName">Company name</label>
          <input type="text" id="applyCompanyName" placeholder="e.g. Kagiso Logistics" required>
        </div>
        <div class="field">
          <label for="applyContactName">Your name</label>
          <input type="text" id="applyContactName" placeholder="e.g. Thandi Mokoena" required>
        </div>
        <div class="field">
          <label>Requested plan</label>
          <div class="plan-options" id="applyPlanOptions">
            ${Object.entries(PLANS).map(([key, p]) => `
              <button type="button" class="plan-opt ${key === applyPlanKey ? 'selected' : ''}" data-plan="${key}">
                ${p.label}
                <div class="plan-opt-quota">${p.quotaBytes ? formatBytes(p.quotaBytes) : 'custom'}</div>
              </button>`).join('')}
          </div>
        </div>
        <div class="field">
          <label for="applyUseCase">What will you be storing? (optional)</label>
          <textarea id="applyUseCase" placeholder="e.g. Delivery proof-of-drop photos and signed waybills, roughly 40GB/month"></textarea>
        </div>
        <button type="submit" class="btn btn-primary" id="applySubmitBtn">Submit application</button>
      </form>
    </div>`;
}

function wireApplyForm() {
  applyPlanKey = 'starter';
  document.querySelectorAll('#applyPlanOptions .plan-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      applyPlanKey = btn.dataset.plan;
      document.querySelectorAll('#applyPlanOptions .plan-opt').forEach(el => el.classList.toggle('selected', el.dataset.plan === applyPlanKey));
    });
  });

  const form = document.getElementById('applyForm');
  if (!form) return;
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const user = auth.currentUser;
    if (!user) return;

    const companyName = document.getElementById('applyCompanyName').value.trim();
    const contactName = document.getElementById('applyContactName').value.trim();
    const useCase = document.getElementById('applyUseCase').value.trim();
    if (!companyName || !contactName) { toast('Fill in your company and your name.', true); return; }

    const btn = document.getElementById('applySubmitBtn');
    btn.disabled = true; btn.textContent = 'Submitting…';
    try {
      await db.collection('applications').add({
        applicantUid: user.uid,
        companyName,
        contactName,
        contactEmail: user.email || null,
        requestedPlan: applyPlanKey,
        useCase: useCase || null,
        status: 'pending',
        submittedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      toast('Application submitted — we\u2019ll review it shortly.');
    } catch (err) {
      console.error(err);
      toast('Could not submit your application. Try again.', true);
      btn.disabled = false; btn.textContent = 'Submit application';
    }
  });
}

// ---------- Approved dashboard ----------
function approvedDashboardHtml(c) {
  const pct = usagePct(c);
  return `
    <div class="page-title">Dashboard</div>
    <div class="page-sub">Your Silo storage workspace.</div>

    <div class="silo-hero">
      <div class="silo-viz">${siloSVG(pct)}</div>
      <div class="silo-hero-stats">
        <div class="silo-hero-name">${escapeHtml(c.name)}</div>
        <div class="silo-hero-plan">${PLANS[c.plan]?.label || c.plan}</div>
        <div class="silo-hero-bytes"><b>${formatBytes(c.usedBytes)}</b> used of ${c.quotaBytes ? formatBytes(c.quotaBytes) : 'custom quota'} (${(pct * 100).toFixed(1)}%)</div>
      </div>
    </div>

    <div class="detail-section">
      <div class="detail-section-title">Workspace</div>
      <div class="detail-row"><span class="detail-row-label">Contact email</span><span class="detail-row-value">${escapeHtml(c.contactEmail || '—')}</span></div>
      <div class="detail-row"><span class="detail-row-label">Onboarded</span><span class="detail-row-value">${formatDate(c.createdAt)}</span></div>
      <div class="detail-row"><span class="detail-row-label">Status</span><span class="detail-row-value" style="color:var(--ok); text-transform:capitalize;">${c.status}</span></div>
    </div>

    <div class="detail-section">
      <div class="detail-section-title">API key</div>
      <div class="detail-row"><span class="detail-row-label">Current key</span><span class="detail-row-value">${escapeHtml(c.apiKeyPrefix || '—')}</span></div>
      <button class="btn btn-ghost" style="width:auto; padding:9px 16px; margin-top:6px;" onclick="openRegenerateKeyModal()">Regenerate key</button>
    </div>`;
}

function openRegenerateKeyModal() {
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <div class="modal-head">
          <div class="modal-title">Regenerate API key</div>
          <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
          <div class="apikey-warning">Your current key will stop working immediately. Any integration using it will need to be updated with the new key.</div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-danger" style="width:auto; padding:11px 20px;" id="confirmRegenBtn" onclick="submitRegenerateKey()">Regenerate</button>
        </div>
      </div>
    </div>`;
}

async function submitRegenerateKey() {
  if (!myCompany) return;
  const btn = document.getElementById('confirmRegenBtn');
  btn.disabled = true; btn.textContent = 'Regenerating…';
  try {
    const key = 'sk_live_' + randomKeySuffix(32);
    const keyHash = await sha256Hex(key);
    await db.collection('companies').doc(myCompany.id).update({
      apiKeyHash: keyHash,
      apiKeyPrefix: key.slice(0, 16) + '…',
      apiKeyCreatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    showNewKeyModal(key);
  } catch (err) {
    console.error(err);
    toast('Could not regenerate key. Try again.', true);
    btn.disabled = false; btn.textContent = 'Regenerate';
  }
}

function showNewKeyModal(key) {
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay">
      <div class="modal">
        <div class="modal-head"><div class="modal-title">New API key</div></div>
        <div class="modal-body">
          <div class="apikey-warning">This key is shown once. Copy it now — Silo only stores a hash of it, so it can't be retrieved later.</div>
          <div class="apikey-box">${key}</div>
          <button class="copy-btn" onclick="navigator.clipboard.writeText('${key}').then(()=>toast('Key copied to clipboard.')).catch(()=>toast('Could not copy — select and copy manually.', true))">Copy to clipboard</button>
        </div>
        <div class="modal-foot">
          <button class="btn btn-primary" style="width:auto; padding:10px 20px;" onclick="closeModal()">Done</button>
        </div>
      </div>
    </div>`;
}

setAuthMode('signin');
</script>
