<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haba · Ad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0a0f0d;color:#f4f4f5;font-family:"Inter Tight",system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px)}
.stage{width:min(100%,calc((100vh - 300px) * 4 / 5));aspect-ratio:4/5;border-radius:18px;overflow:hidden;box-shadow:0 0 0 1px #ffffff18,0 30px 90px #10b98155;background:#fff}
canvas{width:100%;height:100%;display:block}
.bar,.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
button{font:700 14px "Inter Tight",system-ui,sans-serif;padding:12px 20px;border-radius:999px;border:1px solid #ffffff2a;background:#ffffff10;color:#f4f4f5;cursor:pointer;transition:.2s}
button:hover{background:#ffffff20}
button.p{background:#f4f4f5;color:#09090b;border-color:#f4f4f5}
button.p:hover{box-shadow:0 0 30px #34d399aa}
.up{font:700 14px "Inter Tight",system-ui,sans-serif;padding:12px 20px;border-radius:999px;border:1px solid #34d39966;background:#34d39922;color:#f4f4f5;cursor:pointer}.up:hover{background:#34d39940}#logoPrev{width:44px;height:44px;border-radius:12px;object-fit:cover;border:1px solid #ffffff30}
button:disabled{opacity:.5;cursor:wait}
.hide{display:none!important}
select,input{font:600 14px "Inter Tight",system-ui,sans-serif;padding:11px 14px;border-radius:999px;border:1px solid #ffffff2a;background:#ffffff10;color:#f4f4f5;outline:none}
select option{color:#111}input{width:190px}input::placeholder{color:#8fa79d}
#msg{min-height:18px;font-size:13px;color:#9fd8c0;text-align:center}
</style>
</head>
<body>
<div class="stage"><canvas id="cv"></canvas></div>
<div id="login" class="row hide">
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button id="signin">Sign in</button>
  <button id="google">Google</button>
</div>
<div class="row">
  <label class="up" for="logoFile">Upload logo</label><input id="logoFile" type="file" accept="image/*" hidden>
  <img id="logoPrev" class="hide" alt="Logo preview"><button id="logoClear" class="hide">Remove logo</button><span id="logoMsg" style="font-size:13px;color:#ff8a8a"></span>
</div>
<div class="row">
  <select id="voice" aria-label="Voiceover"><option value="rex">Voiceover: Rex (male)</option><option value="sal">Voiceover: Sal (male)</option><option value="leo">Voiceover: Leo (male)</option><option value="none">No voiceover</option></select>
  <select id="sfx" aria-label="Sound effects"><option value="on">Sound effects: On</option><option value="off">Sound effects: Off</option></select>
  <span id="vs" style="font-size:13px;color:#9fd8c0">Sign in to use voiceover</span>
  <button id="out" class="hide">Sign out</button>
</div>
<div id="msg"></div>
<div class="bar">
  <button id="replay">↻ Replay</button>
  <button id="dl" class="p">Download video</button>
  <button id="cp">Copy caption</button>
</div>

<script>
const W = 1080, H = 1350; let T = 24;
const cv = document.getElementById("cv"), c = cv.getContext("2d"); cv.width = W; cv.height = H;
let NOW = 0;
let HEAD = '"Inter Tight",system-ui,sans-serif', INK = "#12151c", GRN = "#087f5b", MINT = "#34d399", LIME = "#6ee7b7", GREY = "#8a9a93";
const FIL = "filter" in CanvasRenderingContext2D.prototype;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), lerp = (a, b, t) => a + (b - a) * t;
const oc = t => 1 - Math.pow(1 - clamp(t), 3), oe = t => { t = clamp(t); return t >= 1 ? 1 : 1 - Math.pow(2, -10 * t); };
const io = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const bk = t => { t = clamp(t); const s = 1.6; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); };
const F = (w, s, fam = HEAD, ls = 0) => { c.font = `${w} ${s}px ${fam}`; c.letterSpacing = ls + "px"; };
let seed = 11; const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const grain = document.createElement("canvas"); grain.width = grain.height = 256;
{ const g = grain.getContext("2d"), d = g.createImageData(256, 256); for (let i = 0; i < d.data.length; i += 4) { const v = R() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); }

// ---------- helpers ----------
function line(words, y, t, d0, size, wt, fill, gap = .28) {
  F(wt, size, HEAD, -size * .035); c.textAlign = "left"; c.textBaseline = "alphabetic";
  let ws = words.map(w => c.measureText(w).width), tot = ws.reduce((a, b) => a + b, 0) + size * gap * (words.length - 1);
  if (tot > W * .86) { size *= W * .86 / tot; F(wt, size, HEAD, -size * .035); ws = words.map(w => c.measureText(w).width); tot = ws.reduce((a, b) => a + b, 0) + size * gap * (words.length - 1); }
  let x = (W - tot) / 2;
  words.forEach((w, i) => {
    const p = oe(seg(t, d0 + i * .12, d0 + i * .12 + .85));
    if (p > 0) { c.save(); c.globalAlpha *= p; c.translate(x, y + (1 - p) * size * .5); if (FIL) c.filter = `blur(${(1 - p) * 14}px)`; c.fillStyle = fill(ws[i], i); c.fillText(w, 0, 0); c.restore(); }
    x += ws[i] + size * gap;
  });
}
function cursor(x, y, k = 1) {
  c.save(); c.translate(x, y); c.scale(k, k); c.shadowColor = "rgba(0,0,0,.3)"; c.shadowBlur = 10; c.shadowOffsetY = 4;
  c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 34); c.lineTo(9, 26); c.lineTo(15, 40); c.lineTo(22, 37); c.lineTo(16, 24); c.lineTo(28, 24); c.closePath();
  c.fillStyle = "#fff"; c.fill(); c.shadowColor = "transparent"; c.strokeStyle = INK; c.lineWidth = 2.5; c.stroke(); c.restore();
}
function ring(x, y, p, col = "8,127,91") { if (p <= 0 || p >= 1) return; c.strokeStyle = `rgba(${col},${.6 * (1 - p)})`; c.lineWidth = 5; c.beginPath(); c.arc(x, y, 20 + oc(p) * 90, 0, 7); c.stroke(); }
function kf(t, K) { if (t <= K[0][0]) return [K[0][1], K[0][2]]; for (let i = 1; i < K.length; i++) if (t <= K[i][0]) { const p = io(seg(t, K[i - 1][0], K[i][0])); return [lerp(K[i - 1][1], K[i][1], p), lerp(K[i - 1][2], K[i][2], p)]; } const L = K[K.length - 1]; return [L[1], L[2]]; }

// ---------- theme + uploaded logo ----------
let SLATE = "#223a37", ARGB = "52,211,153", ARGB2 = "16,185,129", SRGB = "10,132,255", LOGO = null, LOGO_BG = null;
const h2r = (h, s, l) => { const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l), f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); return [f(0), f(8), f(4)].map(v => Math.round(v * 255)); };
const r2h = (r, g, b) => { r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn; let h = 0, s = 0; if (d) { s = d / (1 - Math.abs(2 * l - 1)); h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; } return [h, s, l]; };
const hex = a => "#" + a.map(v => v.toString(16).padStart(2, "0")).join("");
function setTheme(h, s, h2, gray) {
  s = gray ? 0 : Math.max(s, .6); const m = h2r(h, s, gray ? .86 : .58);
  MINT = hex(m); LIME = hex(h2r(h, s, gray ? .96 : .74)); GRN = hex(h2r(h, s, gray ? .5 : .3)); SLATE = hex(h2r(h, gray ? 0 : .25, .17)); ARGB = m.join(","); ARGB2 = h2r(h, s, gray ? .6 : .4).join(","); SRGB = h2r(h2, Math.max(s, gray ? 0 : .6), gray ? .7 : .55).join(",");
}
function resetTheme() { setTheme(160, .6, 215); SLATE = "#223a37"; MINT = "#34d399"; LIME = "#6ee7b7"; GRN = "#0a8f63"; ARGB = "52,211,153"; ARGB2 = "16,185,129"; SRGB = "10,132,255"; LOGO = LOGO_BG = null; }
function themeFrom(img) {
  const S = 48, k = document.createElement("canvas"); k.width = k.height = S; const g = k.getContext("2d", { willReadFrequently: true }); g.drawImage(img, 0, 0, S, S); const d = g.getImageData(0, 0, S, S).data, B = {}; let tr = 0, lum = 0, op = 0;
  for (let i = 0; i < d.length; i += 4) { const a = d[i + 3]; if (a < 250) tr++; if (a < 128) continue; op++; const [h, s, l] = r2h(d[i], d[i + 1], d[i + 2]); lum += l; if (s < .3 || l < .15 || l > .9) continue; const key = Math.floor(h / 20) % 18, b = B[key] || (B[key] = { n: 0, x: 0, y: 0, s: 0 }); b.n += s; b.x += Math.cos(h * Math.PI / 180) * s; b.y += Math.sin(h * Math.PI / 180) * s; b.s += s * s; }
  LOGO_BG = tr / (S * S) > .05 ? (op && lum / op > .6 ? "#0d1211" : "#ffffff") : null;
  const ks = Object.keys(B).sort((a, b) => B[b].n - B[a].n); if (!ks.length) { setTheme(0, 0, 0, true); return; }

  const o = ks.slice(1).find(q => { const dd = Math.abs(((hue(B[q]) - h1 + 540) % 360) - 180); return dd > 40 && B[q].n > b1.n * .15; });
  setTheme(h1, s1, o ? hue(B[o]) : (h1 + 40) % 360);

function loadLogo(url, keep = true) {
  const im = new Image(); im.onload = () => {
    const k = document.createElement("canvas"), m = Math.min(1, 512 / Math.max(im.width, im.height)); k.width = Math.max(1, Math.round(im.width * m)); k.height = Math.max(1, Math.round(im.height * m)); k.getContext("2d").drawImage(im, 0, 0, k.width, k.height);
    LOGO = k; themeFrom(k); const pv = document.getElementById("logoPrev"); pv.src = k.toDataURL("image/png"); pv.classList.remove("hide"); document.getElementById("logoClear").classList.remove("hide");
    if (keep) { try { localStorage.setItem("habaLogo", pv.src); } catch (e) {} }
  }; im.onerror = () => { document.getElementById("logoMsg").textContent = "Could not read that image."; }; im.src = url;
}
document.getElementById("logoFile").onchange = e => { const f = e.target.files[0]; if (!f) return; document.getElementById("logoMsg").textContent = ""; const r = new FileReader(); r.onload = () => loadLogo(r.result); r.readAsDataURL(f); e.target.value = ""; };
document.getElementById("logoClear").onclick = () => { resetTheme(); document.getElementById("logoPrev").classList.add("hide"); document.getElementById("logoClear").classList.add("hide"); try { localStorage.removeItem("habaLogo"); } catch (e) {} };
try { const sv = localStorage.getItem("habaLogo"); if (sv) loadLogo(sv, false); } catch (e) {}

// ---------- shared drawing ----------
function bg() { c.fillStyle = "#000"; c.fillRect(0, 0, W, H); }
function wt(s, x, y, size, col, p, wgt = 700, al = "center") { p = clamp(p); if (p <= 0) return; F(wgt, size, HEAD, -size * .03); c.textAlign = al; c.textBaseline = "middle"; c.save(); c.globalAlpha *= p; if (FIL) c.filter = `blur(${(1 - p) * 16}px)`; c.fillStyle = col; c.fillText(s, x, y + (1 - p) * 24); c.restore(); }
function hmark(x, y, s, rot = 0, a = 1) {
  a = clamp(a); if (a <= 0 || s <= 0) return; c.save(); c.translate(x, y); c.rotate(rot); c.globalAlpha *= a;
  if (LOGO) {
    const q = s * 1.05, r = q * .26, X = -q / 2, Y = -q / 2, sc = Math.max(q / LOGO.width, q / LOGO.height);
    [[-5, "rgba(255,40,90,.45)"], [5, "rgba(40,200,255,.45)"]].forEach(([dx, col]) => { c.save(); c.globalCompositeOperation = "lighter"; rr(X + dx, Y, q, q, r); c.fillStyle = col; c.fill(); c.restore(); });
    c.save(); c.shadowColor = `rgba(${ARGB},.35)`; c.shadowBlur = s * .2; rr(X, Y, q, q, r); c.fillStyle = LOGO_BG || "#0d1211"; c.fill(); c.restore();
    c.save(); rr(X, Y, q, q, r); c.clip(); c.drawImage(LOGO, -LOGO.width * sc / 2, -LOGO.height * sc / 2, LOGO.width * sc, LOGO.height * sc); c.restore();
    c.lineWidth = Math.max(2, s * .02); c.strokeStyle = "rgba(255,255,255,.35)"; rr(X, Y, q, q, r); c.stroke(); c.restore(); return;
  }
  c.scale(s / 100, s / 100);
  const bub = f => { rr(-50, -50, 100, 90, 30); c.fillStyle = f; c.fill(); c.beginPath(); c.moveTo(-32, 36); c.lineTo(-40, 64); c.lineTo(-6, 40); c.closePath(); c.fill(); };
  [[-6, "rgba(255,40,90,.45)"], [6, "rgba(40,200,255,.45)"]].forEach(([dx, col]) => { c.save(); c.globalCompositeOperation = "lighter"; c.translate(dx, 0); bub(col); c.restore(); });
  const g = c.createLinearGradient(-50, -50, 50, 50); g.addColorStop(0, LIME); g.addColorStop(1, GRN); c.shadowColor = `rgba(${ARGB},.35)`; c.shadowBlur = 24; bub(g); c.shadowBlur = 0;
  c.font = '800 66px "Inter Tight",system-ui,sans-serif'; c.letterSpacing = "0px"; c.fillStyle = "#fff"; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText("h", 0, -2); c.restore();
}

// ---------- real SVG icons (Lucide, 24px grid) ----------
const rc=(x,y,w,h)=>`M${x+2} ${y}h${w-4}a2 2 0 0 1 2 2v${h-4}a2 2 0 0 1-2 2h${4-w}a2 2 0 0 1-2-2v${4-h}a2 2 0 0 1 2-2z`,ci=(x,y,r)=>`M${x-r} ${y}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0`;
const D={
 message:["M7.9 20A9 9 0 1 0 4 16.1L2 22Z"],
 at:[ci(12,12,4),"M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"],

 heart:["M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"],
 camera:["M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z",ci(12,13,3)],
 phone:["M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"],

 file:["M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z","M14 2v4a2 2 0 0 0 2 2h4","M10 9H8M16 13H8M16 17H8"],

 gift:[rc(3,8,18,4),"M12 8v13","M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7","M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"]
},ICO={};for(const k in D)ICO[k]=D[k].map(q=>new Path2D(q));
function ico(n,x,y,s,col,lw=2){if(s<=0)return;c.save();c.translate(x-s/2,y-s/2);c.scale(s/24,s/24);c.strokeStyle=col;c.lineWidth=lw;c.lineCap=c.lineJoin="round";ICO[n].forEach(q=>c.stroke(q));c.restore()}
const flat=col=>{c.fillStyle=col;c.fillRect(0,0,W,H)};

// ---------- scenes: black / white backgrounds only ----------
const PI=["message","phone","camera","mail","pin","music","image","video"];
function a0(t){ // black: phone slides in, zoom into Haba icon
  flat("#000");const e=oc(seg(t,0,1)),u=io(seg(t,.9,2.3)),al=1-seg(t,1.8,2.4);
  c.save();c.globalAlpha*=al;c.translate(W/2,H/2);c.scale(1+4*u,1+4*u);c.rotate(-.5+.3*e);c.translate((1-e)*420,(1-e)*300);

  for(let j=-2;j<=2;j++)for(let i=-1;i<=1;i++){if(!i&&!j)continue;const x=i*230,y=j*230;rr(x-75,y-75,150,150,38);c.fillStyle="#fff";c.fill();ico(PI[(i+1+(j+2)*3)%8],x,y,80,"#000",1.8)}
  hmark(0,0,150*(1+.12*Math.sin(seg(t,.8,1.4)*Math.PI)),0,1);ring(0,0,seg(t,.9,1.7),"255,255,255");c.restore();

}
function a1(t){ // white: introducing + logo
  flat("#fff");wt("Introducing",W/2,H/2,124,GRN,seg(t,.1,.7)*(1-seg(t,1.2,1.6)));
  const p=bk(seg(t,1.5,2.2));hmark(W/2,H/2-80,250*p,(1-p)*-2,p);ring(W/2,H/2-80,seg(t,1.6,2.4),ARGB2);
  wt("Haba",W/2,H/2+170,170,INK,seg(t,2.0,2.6));
}
function a2(t){ // black: kinetic tagline
  flat("#000");line(["Your","all-in-one","spot"],H/2-70,t,.1,130,700,()=>"#fff");
  line(["for","every","conversation"],H/2+100,t,1.0,100,600,(w,i)=>i==2?LIME:"#fff");
}
const GL=["at","hash","badge","heart"],SZ=[240,300,380,300];
function a3(t){ // white: tracked box with SVG icons
  flat("#fff");const k=clamp(Math.floor(t/.8),0,3),lt=t-k*.8,s=lerp(k?SZ[k-1]:200,SZ[k],oc(seg(lt,0,.3))),cx=W/2,cy=H/2;

  c.fillStyle="#000";c.fillRect(cx-s/2,cy-s/2,s,s);ico(GL[k],cx,cy,s*.55*bk(seg(lt,0,.35)),"#fff",1.6);
  c.fillStyle=GRN;[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([x,y])=>c.fillRect(cx+x*s/2-8,cy+y*s/2-8,16,16));c.restore();
}
const LI=[["Chats.","message"],["Posts.","file"],["Status.","dot"],["Videos.","video"]];
function a4(t){ // black: list selection with icons
  flat("#000");const p=[0,1,2].reduce((a,i)=>a+io(seg(t,.6+i*.9,1+i*.9)),0),sl=(1-oc(seg(t,0,.6)))*500;
